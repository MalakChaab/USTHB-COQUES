<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Admin — USTHB Coques</title><style>body{margin:0;background:#fff7fb;font-family:Arial;color:#4b3040}.wrap{max-width:900px;margin:auto;padding:25px}.box{background:white;padding:22px;border-radius:22px;box-shadow:0 4px 18px #e9bfd0;margin:18px 0}h1,h2{color:#d94f8b}input{width:100%;box-sizing:border-box;padding:12px;margin:7px 0;border:1px solid #efb0ca;border-radius:12px}button{background:#d94f8b;color:#fff;border:0;padding:12px 18px;border-radius:12px;font-weight:700;cursor:pointer}.product{display:flex;justify-content:space-between;gap:12px;padding:12px;border-bottom:1px solid #f5dbe7}.back{color:#d94f8b;text-decoration:none}</style></head><body><div class="wrap"><a class="back" href="index.html">← Boutique</a><h1>🎀 Tableau de bord</h1><div id="login" class="box"><h2>Accès Admin</h2><input id="pw" type="password" placeholder="Mot de passe"><button onclick="login()">Entrer</button><p id="err"></p></div><div id="dash" style="display:none"><div class="box"><h2>➕ Ajouter un article</h2><input id="name" placeholder="Nom de l'article"><input id="model" placeholder="Modèle (ex. iPhone 13)"><input id="price" type="number" placeholder="Prix en DA"><input id="img" placeholder="URL de l'image (temporaire)"><button onclick="add()">Ajouter</button></div><div class="box"><h2>📦 Articles</h2><div id="list"></div></div></div></div><script>const PASS='change-me';function login(){if(document.getElementById('pw').value===PASS){login.style.display='none';dash.style.display='block';render()}else err.textContent='Mot de passe incorrect.'}function get(){return JSON.parse(localStorage.getItem('usthb_products')||'[]')}function add(){let a=get();a.push({name:name.value,model:model.value,price:Number(price.value),img:img.value});localStorage.setItem('usthb_products',JSON.stringify(a));name.value=model.value=price.value=img.value='';render()}function del(i){let a=get();a.splice(i,1);localStorage.setItem('usthb_products',JSON.stringify(a));render()}function render(){list.innerHTML=get().map((x,i)=>`<div class="product"><span><b>${x.name}</b><br>${x.model} — ${x.price} DA</span><button onclick="del(${i})">Supprimer</button></div>`).join('')||'Aucun article.'}</script></body></html>
