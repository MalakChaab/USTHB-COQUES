<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Admin — USTHB Cases</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><style>body{margin:0;background:#fff7fb;font-family:Arial;color:#4b3040}.wrap{max-width:900px;margin:auto;padding:22px}.box{background:#fff;padding:22px;border-radius:22px;box-shadow:0 4px 18px #e9bfd0;margin:18px 0}h1,h2{color:#d94f8b}input,select{width:100%;padding:12px;margin:7px 0;border:1px solid #efb0ca;border-radius:12px;font-size:15px;box-sizing:border-box}button{background:#d94f8b;color:#fff;border:0;padding:12px 18px;border-radius:12px;font-weight:700;cursor:pointer}.secondary{background:#fff;color:#d94f8b;border:1px solid #d94f8b}.phones{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}.phone{display:flex;align-items:center;gap:7px;background:#fff7fb;border:1px solid #efb0ca;padding:9px;border-radius:10px}.phone input{width:auto;margin:0}.stock{width:75px!important;margin:0!important;padding:8px!important}.custom{display:none}.custom.show{display:block}.hidden{display:none}.simpleStock{display:none}.simpleStock.show{display:block}.product{display:flex;align-items:center;justify-content:space-between;gap:15px;padding:12px 0;border-bottom:1px solid #f5dbe7}.product img{width:65px;height:65px;object-fit:cover;border-radius:12px}.info{display:flex;gap:12px;align-items:center;flex:1}.actions{display:flex;gap:7px}.msg{padding:10px;border-radius:10px;background:#fff0f6;margin-top:10px}.preview{width:75px;height:75px;object-fit:cover;border-radius:10px;margin:5px}.photoHint{font-size:13px;color:#8a6677}.photoCount{font-weight:bold;color:#d94f8b}@media(max-width:600px){.phones{grid-template-columns:1fr}.product{align-items:flex-start}.actions{flex-direction:column}}</style></head><body><div class="wrap"><a href="index.html" style="color:#d94f8b">← Boutique</a><h1>🎀 Admin USTHB Cases</h1><div id="login" class="box"><h2>🔐 Connexion</h2><form id="loginForm"><input id="email" type="email" placeholder="Email admin" required><input id="password" type="password" placeholder="Mot de passe" required><button id="loginButton">Se connecter</button><div id="loginMsg" class="msg hidden"></div></form></div><div id="dash" class="hidden"><button class="secondary" onclick="logout()">Se déconnecter</button><div class="box"><h2 id="formTitle">➕ Ajouter un produit</h2><input id="name" placeholder="Nom du produit" required><label><b>Catégorie du produit</b></label><select id="category"><option value="cases">📱 CASES — Coques téléphone</option><option value="accessoires">✨ ACCESSOIRES</option><option value="ventouses">🚗 VENTOUSES</option><option value="ipad">📱 IPAD</option></select><input id="price" type="number" min="0" placeholder="Prix en DA" required><div id="caseFields"><h3>📱 Modèles iPhone + stock</h3><div id="iphonePhones" class="phones"></div><label><input type="radio" name="phoneType" value="iphone" checked onchange="togglePhones()"> iPhone</label><label><input type="radio" name="phoneType" value="other" onchange="togglePhones()"> Autre modèle</label><input id="customModel" class="custom" placeholder="Écris le modèle"><input id="customStock" class="custom" type="number" min="0" placeholder="Stock"></div><div id="simpleFields" class="simpleStock"><h3>📦 Quantité en stock</h3><input id="simpleStockValue" type="number" min="0" placeholder="Ex : 5"></div><label>📸 Photos de l'article</label><input id="photo" type="file" accept="image/*" multiple><div class="photoHint">Plusieurs photos possibles. <span id="photoCount" class="photoCount"></span></div><div id="previews"></div><input id="img" placeholder="Ou URL(s), séparées par une virgule"><button type="button" onclick="save()">Enregistrer</button><button id="cancel" type="button" class="secondary hidden" onclick="resetForm()">Annuler</button><div id="formMsg" class="msg hidden"></div></div><div class="box"><h2>📦 Produits</h2><div id="list">Chargement…</div></div></div></div><script>const db=supabase.createClient('https://sydurxdeqjgyuzvotmth.supabase.co','sb_publishable_YtZkRYlml5U_6OtOKcnnyQ_smF0CELK'),$=id=>document.getElementById(id);let editingId=null,photoData=[],products=[];const phones=['iPhone XS','iPhone XS Max','iPhone XR','iPhone 11','iPhone 11 Pro','iPhone 11 Pro Max','iPhone 12 mini','iPhone 12','iPhone 12 Pro','iPhone 12 Pro Max','iPhone 13 mini','iPhone 13','iPhone 13 Pro','iPhone 13 Pro Max','iPhone 14','iPhone 14 Plus','iPhone 14 Pro','iPhone 14 Pro Max','iPhone 15','iPhone 15 Plus','iPhone 15 Pro','iPhone 15 Pro Max','iPhone 16','iPhone 16 Plus','iPhone 16 Pro','iPhone 16 Pro Max','iPhone 17','iPhone 17 Plus','iPhone 17 Pro','iPhone 17 Pro Max','iPhone Air','iPhone 18','iPhone 18 Plus','iPhone 18 Pro','iPhone 18 Pro Max'];$('iphonePhones').innerHTML=phones.map(p=>`<label class="phone"><input type="checkbox" value="${p}">${p}<input class="stock" type="number" min="0" value="0"></label>`).join('');function categoryChanged(){let isCase=$('category').value==='cases';$('caseFields').classList.toggle('hidden',!isCase);$('simpleFields').classList.toggle('show',!isCase)}$('category').addEventListener('change',categoryChanged);function togglePhones(){let other=document.querySelector('input[name=phoneType]:checked')?.value==='other';$('iphonePhones').style.display=other?'none':'grid';$('customModel').classList.toggle('show',other);$('customStock').classList.toggle('show',other)}function msg(t){$('formMsg').textContent=t;$('formMsg').classList.remove('hidden')}async function login(){let b=$('loginButton');b.disabled=true;let r=await db.auth.signInWithPassword({email:$('email').value.trim(),password:$('password').value});if(r.error){$('loginMsg').textContent=r.error.message;$('loginMsg').classList.remove('hidden');b.disabled=false;return}$('login').classList.add('hidden');$('dash').classList.remove('hidden');load()}$('loginForm').onsubmit=e=>{e.preventDefault();login()};async function logout(){await db.auth.signOut();location.reload()}function imgs(v){return String(v||'').split('||').filter(Boolean)}function selectedStock(){let r={};if($('category').value!=='cases'){r.stock_total=Math.max(0,Number($('simpleStockValue').value)||0);return r}if(document.querySelector('input[name=phoneType]:checked').value==='other'){let m=$('customModel').value.trim();if(m)r[m]=Math.max(0,Number($('customStock').value)||0)}else document.querySelectorAll('#iphonePhones .phone').forEach(l=>{let c=l.querySelector('input[type=checkbox]');if(c.checked)r[c.value]=Math.max(0,Number(l.querySelector('.stock').value)||0)});return r}function compress(file){return new Promise((resolve,reject)=>{let reader=new FileReader();reader.onerror=reject;reader.onload=()=>{let im=new Image();im.onload=()=>{let max=1400,w=im.width,h=im.height;if(Math.max(w,h)>max){if(w>=h){h=Math.round(h*max/w);w=max}else{w=Math.round(w*max/h);h=max}}let c=document.createElement('canvas');c.width=w;c.height=h;c.getContext('2d').drawImage(im,0,0,w,h);resolve(c.toDataURL('image/jpeg',.78))};im.onerror=reject;im.src=reader.result};reader.readAsDataURL(file)})}async function handlePhotos(files){photoData=[];$('previews').innerHTML='';$('photoCount').textContent=files.length?`(${files.length} sélectionnée(s))`:'';for(let f of [...files].slice(0,10)){try{let x=await compress(f);photoData.push(x);$('previews').insertAdjacentHTML('beforeend',`<img class="preview" src="${x}">`)}catch(e){}}}async function save(){let nom=$('name').value.trim(),prix=Number($('price').value),cat=String($('category').value).trim().toLowerCase(),st=selectedStock(),mods=Object.keys(st),urls=photoData.length?photoData:$('img').value.split(',').map(x=>x.trim()).filter(Boolean);if(!nom||!prix||!urls.length||(cat==='cases'&&!mods.length)){msg('Remplis les informations obligatoires.');return}let payload={nom:nom,modele:cat==='cases'?mods.join('||'):nom,prix:prix,image_url:urls.join('||'),stock:st,categorie:cat,disponible:cat==='cases'?Object.values(st).some(v=>Number(v)>0):Number(st.stock_total)>0};let r=editingId?await db.from('coques').update(payload).eq('id',editingId):await db.from('coques').insert(payload);if(r.error){msg('Erreur : '+r.error.message);return}msg('Produit enregistré dans '+cat.toUpperCase()+' 💗');resetForm();load()}async function load(){let r=await db.from('coques').select('*').order('created_at',{ascending:false});if(r.error){$('list').textContent=r.error.message;return}products=r.data||[];render()}function render(){$('list').innerHTML=products.length?products.map(x=>{let st=x.stock||{};return `<div class="product"><div class="info"><img src="${imgs(x.image_url)[0]||''}"><span><b>${x.nom}</b><br><strong>${(x.categorie||'cases').toUpperCase()}</strong> — ${Number(x.prix).toLocaleString('fr-DZ')} DA<br><small>${Object.entries(st).map(([m,n])=>m+' = '+n).join(' • ')}</small></span></div><div class="actions"><button onclick="edit('${x.id}')">Modifier</button><button onclick="del('${x.id}')">Supprimer</button></div></div>`}).join(''):'Aucun produit.'}function edit(id){let x=products.find(p=>String(p.id)===String(id));editingId=id;$('name').value=x.nom||'';$('price').value=x.prix||'';$('category').value=['cases','accessoires','ventouses','ipad'].includes(String(x.categorie||'').toLowerCase())?String(x.categorie).toLowerCase():'cases';categoryChanged();$('img').value=imgs(x.image_url).join(',');if($('category').value==='cases'){document.querySelectorAll('#iphonePhones .phone').forEach(l=>{let c=l.querySelector('input[type=checkbox]');c.checked=(x.stock||{})[c.value]!==undefined;l.querySelector('.stock').value=(x.stock||{})[c.value]||0})}else $('simpleStockValue').value=Number((x.stock||{}).stock_total||0);$('formTitle').textContent='✏️ Modifier le produit';$('cancel').classList.remove('hidden');scrollTo(0,0)}async function del(id){if(confirm('Supprimer ce produit ?')){let r=await db.from('coques').delete().eq('id',id);if(r.error)alert(r.error.message);else load()}}function resetForm(){editingId=null;photoData=[];$('name').value='';$('price').value='';$('img').value='';$('photo').value='';$('previews').innerHTML='';$('photoCount').textContent='';$('simpleStockValue').value='';document.querySelectorAll('#iphonePhones input[type=checkbox]').forEach(x=>x.checked=false);document.querySelectorAll('.stock').forEach(x=>x.value=0);$('category').value='cases';document.querySelector('input[name=phoneType][value=iphone]').checked=true;togglePhones();categoryChanged();$('formTitle').textContent='➕ Ajouter un produit';$('cancel').classList.add('hidden')}$('photo').onchange=e=>handlePhotos(e.target.files);(async()=>{let r=await db.auth.getSession();if(r.data.session){$('login').classList.add('hidden');$('dash').classList.remove('hidden');load()}})()</script></body></html>
