<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Admin — USTHB Coques</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><style>*{box-sizing:border-box}body{margin:0;background:#fff7fb;font-family:Arial;color:#4b3040}.wrap{max-width:900px;margin:auto;padding:22px}.box{background:#fff;padding:22px;border-radius:22px;box-shadow:0 4px 18px #e9bfd0;margin:18px 0}h1,h2{color:#d94f8b}input{width:100%;padding:12px;margin:7px 0;border:1px solid #efb0ca;border-radius:12px;font-size:15px}button{background:#d94f8b;color:#fff;border:0;padding:12px 18px;border-radius:12px;font-weight:700;cursor:pointer;touch-action:manipulation}.secondary{background:#fff;color:#d94f8b;border:1px solid #d94f8b}.back{color:#d94f8b;text-decoration:none}.hidden{display:none}.product{display:flex;align-items:center;justify-content:space-between;gap:15px;padding:12px 0;border-bottom:1px solid #f5dbe7}.product img{width:65px;height:65px;object-fit:cover;border-radius:12px}.info{display:flex;align-items:center;gap:12px;flex:1}.actions{display:flex;gap:7px}.msg{padding:10px;border-radius:10px;background:#fff0f6;margin-top:10px}.phones{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin:12px 0}.phone{display:flex;align-items:center;gap:7px;background:#fff7fb;border:1px solid #efb0ca;padding:9px;border-radius:10px}.phone input{width:auto;margin:0}.stock{width:75px!important;margin:0!important;padding:8px!important}.custom{display:none}.custom.show{display:block}.preview{width:70px;height:70px;object-fit:cover;border-radius:10px;margin:5px}.thumbs{display:flex;flex-wrap:wrap}@media(max-width:600px){.phones{grid-template-columns:1fr}.product{align-items:flex-start}.actions{flex-direction:column}}</style></head><body><div class="wrap"><a class="back" href="index.html">← Boutique</a><h1>🎀 Tableau de bord Admin</h1><div id="login" class="box"><h2>🔐 Connexion</h2><form id="loginForm"><input id="email" type="email" autocomplete="email" placeholder="Email admin" required><input id="password" type="password" autocomplete="current-password" placeholder="Mot de passe" required><button id="loginButton" type="submit">Se connecter</button><div id="loginMsg" class="msg hidden"></div></form></div><div id="dash" class="hidden"><div class="box"><button class="secondary" onclick="logout()">Se déconnecter</button></div><div class="box"><h2 id="formTitle">➕ Ajouter une coque</h2><input id="name" placeholder="Nom de la coque"><input id="price" type="number" min="0" placeholder="Prix en DA"><h3>📱 Modèles + stock</h3><p>Coche les modèles disponibles et indique combien tu en as.</p><div id="iphonePhones" class="phones"></div><label><input type="radio" name="phoneType" value="other" onchange="togglePhones()"> Autre modèle</label><input id="customModel" class="custom" placeholder="Écris le modèle (ex. Samsung A56)"><input id="customStock" class="custom" type="number" min="0" placeholder="Stock de ce modèle"><p><b>Modèles sélectionnés :</b> <span id="selectedCount">0</span></p><label>📸 Photos — plusieurs photos possibles</label><input id="photo" type="file" accept="image/*" multiple><div id="previews" class="thumbs"></div><input id="img" placeholder="Ou URL(s), séparées par une virgule"><button type="button" onclick="save()">Enregistrer</button><button id="cancel" type="button" class="secondary hidden" onclick="resetForm()">Annuler</button><div id="formMsg" class="msg hidden"></div></div><div class="box"><h2>📦 Mes coques</h2><div id="list">Chargement…</div></div></div></div><script>const SUPABASE_URL='https://sydurxdeqjgyuzvotmth.supabase.co',SUPABASE_KEY='sb_publishable_YtZkRYlml5U_6OtOKcnnyQ_smF0CELK',db=window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY);let editingId=null,photoData=[];const $=id=>document.getElementById(id);const phones=['iPhone XS','iPhone XS Max','iPhone XR','iPhone 11','iPhone 11 Pro','iPhone 11 Pro Max','iPhone 12 mini','iPhone 12','iPhone 12 Pro','iPhone 12 Pro Max','iPhone 13 mini','iPhone 13','iPhone 13 Pro','iPhone 13 Pro Max','iPhone 14','iPhone 14 Plus','iPhone 14 Pro','iPhone 14 Pro Max','iPhone 15','iPhone 15 Plus','iPhone 15 Pro','iPhone 15 Pro Max','iPhone 16','iPhone 16 Plus','iPhone 16 Pro','iPhone 16 Pro Max','iPhone 17','iPhone 17 Plus','iPhone 17 Pro','iPhone 17 Pro Max','iPhone Air','iPhone 18','iPhone 18 Plus','iPhone 18 Pro','iPhone 18 Pro Max'];$('iphonePhones').innerHTML=phones.map((p,i)=>`<label class="phone"><input type="checkbox" value="${p}" onchange="countPhones()">${p}<input class="stock" type="number" min="0" value="0" placeholder="stock" onchange="countPhones()"></label>`).join('');function countPhones(){let n=[...document.querySelectorAll('#iphonePhones input[type=checkbox]:checked')].length+($('customModel').value.trim()?1:0);$('selectedCount').textContent=n}function togglePhones(){let other=document.querySelector('input[name=phoneType]:checked')?.value==='other';$('iphonePhones').style.display=other?'none':'grid';$('customModel').classList.toggle('show',other);$('customStock').classList.toggle('show',other);if(!other){$('customModel').value='';$('customStock').value=''}countPhones()}function msg(id,t){$(id).textContent=t;$(id).classList.remove('hidden')}async function login(){let b=$('loginButton');b.disabled=true;b.textContent='Connexion…';let {error}=await db.auth.signInWithPassword({email:$('email').value.trim(),password:$('password').value});if(error){msg('loginMsg','Connexion impossible : '+error.message);b.disabled=false;b.textContent='Se connecter';return}showDash()}$('loginForm').addEventListener('submit',e=>{e.preventDefault();login()});async function logout(){await db.auth.signOut();location.reload()}async function showDash(){$('login').classList.add('hidden');$('dash').classList.remove('hidden');load()}function images(v){return String(v||'').split('||').map(x=>x.trim()).filter(Boolean)}function selectedStock(){let r={};if(document.querySelector('input[name=phoneType]:checked').value==='other'){let m=$('customModel').value.trim();if(m)r[m]=Math.max(0,Number($('customStock').value)||0)}else document.querySelectorAll('#iphonePhones .phone').forEach(l=>{let c=l.querySelector('input[type=checkbox]'),s=l.querySelector('.stock');if(c.checked)r[c.value]=Math.max(0,Number(s.value)||0)});return r}async function load(){let {data,error}=await db.from('coques').select('*').order('created_at',{ascending:false});if(error){$('list').innerHTML='<div class="msg">Erreur Supabase : '+error.message+'</div>';return}window.products=data||[];render()}function render(){$('list').innerHTML=window.products.length?window.products.map(x=>{let im=images(x.image_url),st=x.stock||{};return `<div class="product"><div class="info"><img src="${im[0]||''}"><span><b>${esc(x.nom)}</b><br>${esc(x.modele||'')} — <b>${Number(x.prix||0).toLocaleString('fr-DZ')} DA</b><br><small>Stock : ${Object.entries(st).map(([m,n])=>esc(m)+' = '+n).join(' • ')||'non défini'}</small></span></div><div class="actions"><button onclick="edit('${x.id}')">Modifier</button><button onclick="del('${x.id}')">Supprimer</button></div></div>`}).join(''):'Aucune coque.'}function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}$('photo').addEventListener('change',e=>{photoData=[];let fs=[...e.target.files];if(fs.length>8){msg('formMsg','Maximum 8 photos.');e.target.value='';return}Promise.all(fs.map(f=>new Promise(r=>{let x=new FileReader();x.onload=()=>r(x.result);x.readAsDataURL(f)}))).then(a=>{photoData=a;$('previews').innerHTML=a.map(x=>`<img class="preview" src="${x}">`).join('')})});async function save(){let nom=$('name').value.trim(),prix=Number($('price').value),st=selectedStock(),mods=Object.keys(st),urls=photoData.length?photoData:$('img').value.split(',').map(x=>x.trim()).filter(Boolean);if(!nom||!prix||!mods.length||mods.some(m=>st[m]<0)||!urls.length){msg('formMsg','Remplis le nom, le prix, choisis au moins un modèle avec son stock et ajoute une photo.');return}let payload={nom,modele:mods.join('||'),prix,image_url:urls.join('||'),stock:st,disponible:true};let q=editingId?db.from('coques').update(payload).eq('id',editingId):db.from('coques').insert(payload);let {error}=await q;if(error){msg('formMsg','Erreur : '+error.message);return}msg('formMsg',editingId?'Coque modifiée 💗':'Coque ajoutée 💗');resetForm();load()}function edit(id){let x=window.products.find(p=>String(p.id)===String(id));if(!x)return;editingId=id;$('name').value=x.nom||'';$('price').value=x.prix||'';let st=x.stock||{},ms=Object.keys(st);let isI=ms.some(m=>phones.includes(m));document.querySelector(`input[name=phoneType][value="${isI?'iphone':'other'}"]`).checked=true;togglePhones();if(isI){document.querySelectorAll('#iphonePhones .phone').forEach(l=>{let c=l.querySelector('input[type=checkbox]'),s=l.querySelector('.stock');c.checked=ms.includes(c.value);s.value=st[c.value]??0})}else{$('customModel').value=ms[0]||'';$('customStock').value=st[ms[0]]??0}countPhones();$('img').value=images(x.image_url).join(', ');$('previews').innerHTML=images(x.image_url).map(x=>`<img class="preview" src="${x}">`).join('');$('formTitle').textContent='✏️ Modifier la coque';$('cancel').classList.remove('hidden');window.scrollTo({top:0,behavior:'smooth'})}async function del(id){if(!confirm('Supprimer cette coque ?'))return;let {error}=await db.from('coques').delete().eq('id',id);if(error)alert(error.message);else load()}function resetForm(){editingId=null;photoData=[];$('name').value='';$('price').value='';$('img').value='';$('photo').value='';$('previews').innerHTML='';document.querySelectorAll('#iphonePhones input[type=checkbox]').forEach(x=>x.checked=false);document.querySelectorAll('#iphonePhones .stock').forEach(x=>x.value=0);document.querySelector('input[name=phoneType][value="iphone"]').checked=true;$('customModel').value='';$('customStock').value='';togglePhones();$('formTitle').textContent='➕ Ajouter une coque';$('cancel').classList.add('hidden')} (async()=>{let {data:{session}}=await db.auth.getSession();if(session)showDash()})();</script></body></html>
