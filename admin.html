<!doctype html>
<html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Admin — USTHB Coques</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><style>
*{box-sizing:border-box}body{margin:0;background:#fff7fb;font-family:Arial;color:#4b3040}.wrap{max-width:900px;margin:auto;padding:22px}.box{background:white;padding:22px;border-radius:22px;box-shadow:0 4px 18px #e9bfd0;margin:18px 0}h1,h2{color:#d94f8b}input{width:100%;padding:12px;margin:7px 0;border:1px solid #efb0ca;border-radius:12px;font-size:15px}button{background:#d94f8b;color:#fff;border:0;padding:12px 18px;border-radius:12px;font-weight:700;cursor:pointer}.secondary{background:#fff;color:#d94f8b;border:1px solid #d94f8b}.back{color:#d94f8b;text-decoration:none}.hidden{display:none}.product{display:flex;align-items:center;justify-content:space-between;gap:15px;padding:12px 0;border-bottom:1px solid #f5dbe7}.product img{width:65px;height:65px;object-fit:cover;border-radius:12px;background:#ffe8f1}.info{display:flex;align-items:center;gap:12px;flex:1}.msg{padding:10px;border-radius:10px;background:#fff0f6;margin-top:10px}.actions{display:flex;gap:7px}.preview{max-width:120px;max-height:120px;border-radius:14px;display:none;margin-top:8px}@media(max-width:600px){.product{align-items:flex-start}.actions{flex-direction:column}.product img{width:55px;height:55px}}
</style></head><body><div class="wrap"><a class="back" href="index.html">← Boutique</a><h1>🎀 Tableau de bord Admin</h1>
<div id="login" class="box"><h2>🔐 Connexion</h2><p>Utilise le compte administrateur créé dans Supabase Authentication.</p><input id="email" type="email" placeholder="Email admin"><input id="password" type="password" placeholder="Mot de passe"><button onclick="login()">Se connecter</button><div id="loginMsg" class="msg hidden"></div></div>
<div id="dash" class="hidden"><div class="box"><button class="secondary" onclick="logout()">Se déconnecter</button></div>
<div class="box"><h2 id="formTitle">➕ Ajouter une coque</h2><input id="name" placeholder="Nom de la coque"><input id="model" placeholder="Modèle (ex. iPhone 13)"><input id="price" type="number" min="0" placeholder="Prix en DA"><input id="photo" type="file" accept="image/*"><img id="preview" class="preview"><input id="img" placeholder="Ou URL de l'image"><button onclick="save()">Enregistrer</button><button id="cancel" class="secondary hidden" onclick="resetForm()">Annuler</button><div id="formMsg" class="msg hidden"></div></div>
<div class="box"><h2>📦 Mes coques</h2><div id="list">Chargement…</div></div></div></div>
<script>
const SUPABASE_URL='https://sydurxdeqjgyuzvotmth.supabase.co';const SUPABASE_KEY='sb_publishable_YtZkRYlml5U_6OtOKcnnyQ_smF0CELK';const db=window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY);let editingId=null,photoData='';
const $=id=>document.getElementById(id);function msg(el,text){$(el).textContent=text;$(el).classList.remove('hidden')}
async function login(){let {error}=await db.auth.signInWithPassword({email:$('email').value.trim(),password:$('password').value});if(error){msg('loginMsg','Connexion impossible : '+error.message);return}showDash()}
async function logout(){await db.auth.signOut();$('dash').classList.add('hidden');$('login').classList.remove('hidden')}
async function showDash(){ $('login').classList.add('hidden');$('dash').classList.remove('hidden');load() }
async function load(){let {data,error}=await db.from('coques').select('*').order('created_at',{ascending:false});if(error){$('list').innerHTML='<div class="msg">Erreur Supabase : '+error.message+'</div>';return}window.products=data||[];render()}
function render(){$('list').innerHTML=window.products.length?window.products.map(x=>`<div class="product"><div class="info"><img src="${x.image_url||''}" onerror="this.style.visibility='hidden'"><span><b>${esc(x.nom||'Coque')}</b><br>${esc(x.modele||'')} — <b>${Number(x.prix||0).toLocaleString('fr-DZ')} DA</b></span></div><div class="actions"><button onclick="edit('${x.id}')">Modifier</button><button onclick="del('${x.id}')">Supprimer</button></div></div>`).join(''):'Aucune coque pour le moment.'}
function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
$('photo').addEventListener('change',e=>{let f=e.target.files[0];if(!f)return;if(f.size>1200000){msg('formMsg','Photo trop lourde. Choisis une image de moins de 1,2 Mo.');e.target.value='';return}let r=new FileReader();r.onload=()=>{photoData=r.result;$('preview').src=photoData;$('preview').style.display='block'};r.readAsDataURL(f)})
async function save(){let nom=$('name').value.trim(),modele=$('model').value.trim(),prix=Number($('price').value),image_url=photoData||$('img').value.trim()||null;if(!nom||!modele||!prix){msg('formMsg','Remplis le nom, le modèle et le prix.');return}let payload={nom,modele,prix,image_url};let result=editingId?await db.from('coques').update(payload).eq('id',editingId):await db.from('coques').insert(payload);if(result.error){msg('formMsg','Erreur : '+result.error.message);return}msg('formMsg',editingId?'Coque modifiée 💗':'Coque ajoutée 💗');resetForm();load()}
function edit(id){let x=window.products.find(p=>String(p.id)===String(id));if(!x)return;editingId=id;$('name').value=x.nom||'';$('model').value=x.modele||'';$('price').value=x.prix||'';$('img').value=x.image_url||'';$('formTitle').textContent='✏️ Modifier la coque';$('cancel').classList.remove('hidden');window.scrollTo({top:0,behavior:'smooth'})}
async function del(id){if(!confirm('Supprimer cette coque ?'))return;let {error}=await db.from('coques').delete().eq('id',id);if(error){alert(error.message);return}load()}
function resetForm(){editingId=null;photoData='';$('name').value='';$('model').value='';$('price').value='';$('img').value='';$('photo').value='';$('preview').style.display='none';$('formTitle').textContent='➕ Ajouter une coque';$('cancel').classList.add('hidden')}
(async()=>{let {data:{session}}=await db.auth.getSession();if(session)showDash()})();
</script></body></html>
