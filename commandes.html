<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Commandes — Admin</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><style>body{margin:0;background:#fff7fb;font-family:Arial;color:#4b3040}.wrap{max-width:1000px;margin:auto;padding:22px}.box,.order{background:#fff;padding:20px;border-radius:20px;box-shadow:0 4px 18px #e9bfd0;margin:16px 0}h1,h2{color:#d94f8b}.hidden{display:none}input,button{padding:12px;border-radius:12px;border:1px solid #efb0ca;margin:5px 0;box-sizing:border-box}input{width:100%}button{background:#d94f8b;color:white;border:0;font-weight:bold;cursor:pointer}.secondary{background:white;color:#d94f8b;border:1px solid #d94f8b}.order{border-left:5px solid #d94f8b}.row{display:flex;justify-content:space-between;gap:15px;flex-wrap:wrap}.total{font-size:20px;color:#d94f8b;font-weight:bold}.muted{color:#876b78;font-size:13px}.error{background:#ffe6ee;padding:12px;border-radius:10px;color:#9b3159}@media(max-width:600px){.row{display:block}}</style></head><body><div class="wrap"><a href="index.html" style="color:#d94f8b">← Boutique</a><h1>🛍️ Commandes</h1><div id="login" class="box"><h2>🔐 Espace Admin</h2><form id="loginForm"><input id="email" type="email" placeholder="Email admin" required><input id="password" type="password" placeholder="Mot de passe" required><button>Se connecter</button><div id="loginMsg"></div></form></div><div id="dash" class="hidden"><div class="row"><button onclick="loadOrders()">↻ Actualiser</button><button class="secondary" onclick="logout()">Se déconnecter</button></div><div id="orders"></div></div></div><script>const db=supabase.createClient('https://sydurxdeqjgyuzvotmth.supabase.co','sb_publishable_YtZkRYlml5U_6OtOKcnnyQ_smF0CELK');const $=id=>document.getElementById(id),money=n=>Number(n||0).toLocaleString('fr-DZ')+' DA';async function login(){let r=await db.auth.signInWithPassword({email:$('email').value.trim(),password:$('password').value});if(r.error){$('loginMsg').className='error';$('loginMsg').textContent=r.error.message;return}$('login').classList.add('hidden');$('dash').classList.remove('hidden');loadOrders()}$('loginForm').onsubmit=e=>{e.preventDefault();login()};async function logout(){await db.auth.signOut();location.reload()}async function loadOrders(){let r=await db.from('commandes').select('*').order('created_at',{ascending:false});if(r.error){$('orders').innerHTML='<div class="error">'+r.error.message+'</div>';return}let a=r.data||[];$('orders').innerHTML=a.length?a.map(o=>`<div class="order"><div class="row"><h2>Commande #${o.id}</h2><span class="muted">${new Date(o.created_at).toLocaleString('fr-DZ')}</span></div><p><b>Client :</b> ${o.nom_client||''}</p><p><b>Téléphone :</b> ${o.telephone||''}</p><p><b>Produit :</b> ${o.produit||''}</p><p><b>Wilaya :</b> ${o.wilaya||''}</p><p><b>Livraison :</b> ${o.livraison||''}</p>${o.adresse?`<p><b>Adresse :</b> ${o.adresse}</p>`:''}<div class="row"><span>Produit : ${money(o.prix_produit)}</span><span>Livraison : ${money(o.frais_livraison)}</span><span class="total">Total : ${money(o.total)}</span></div></div>`).join(''):'<div class="box">Aucune commande pour le moment 💗</div>'}(async()=>{let r=await db.auth.getSession();if(r.data.session){$('login').classList.add('hidden');$('dash').classList.remove('hidden');loadOrders()}})()</script></body></html>
