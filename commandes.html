<!doctype html>
<html lang="fr">

<head>

<meta charset="utf-8">

<meta
  name="viewport"
  content="width=device-width,initial-scale=1"
>

<title>Commandes — Admin</title>


<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>


<style>

*{
  box-sizing:border-box;
}


body{
  margin:0;
  background:#fff7fb;
  font-family:Arial,sans-serif;
  color:#4b3040;
}


.wrap{
  max-width:1100px;
  margin:auto;
  padding:22px;
}


a{
  color:#d94f8b;
  text-decoration:none;
}


h1,
h2{
  color:#d94f8b;
}


.box,
.order{
  background:#fff;
  padding:20px;
  border-radius:20px;
  box-shadow:0 4px 18px #e9bfd0;
  margin:16px 0;
}


.hidden{
  display:none!important;
}


input,
button,
select{
  padding:12px;
  border-radius:12px;
  border:1px solid #efb0ca;
  margin:5px 0;
  box-sizing:border-box;
}


input,
select{
  width:100%;
}


button{
  background:#d94f8b;
  color:white;
  border:0;
  font-weight:bold;
  cursor:pointer;
}


.secondary{
  background:white;
  color:#d94f8b;
  border:1px solid #d94f8b;
}


.order{
  border-left:5px solid #d94f8b;
}


.row{
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:15px;
  flex-wrap:wrap;
}


.total{
  font-size:20px;
  color:#d94f8b;
  font-weight:bold;
}


.muted{
  color:#876b78;
  font-size:13px;
}


.error{
  background:#ffe6ee;
  padding:15px;
  border-radius:12px;
  color:#9b3159;
  margin:15px 0;
}


.success{
  background:#e8fff0;
  padding:15px;
  border-radius:12px;
  color:#237344;
  margin:15px 0;
}


.order-header{
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:15px;
  flex-wrap:wrap;
}


.order-id{
  background:#fff0f6;
  color:#d94f8b;
  padding:8px 12px;
  border-radius:999px;
  font-weight:bold;
}


.info-grid{
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:10px;
  margin-top:15px;
}


.info{
  background:#fff7fb;
  padding:12px;
  border-radius:12px;
}


.info strong{
  display:block;
  color:#876b78;
  font-size:12px;
  margin-bottom:5px;
}


.delivery{
  display:inline-block;
  padding:7px 12px;
  border-radius:999px;
  background:#ffe5f0;
  color:#b6376e;
  font-weight:bold;
}


.empty{
  text-align:center;
  padding:60px 20px;
  background:#fff;
  border-radius:20px;
  box-shadow:0 4px 18px #e9bfd0;
}


.loading{
  text-align:center;
  padding:30px;
}


.stats{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:12px;
  margin:20px 0;
}


.stat{
  background:white;
  padding:18px;
  border-radius:18px;
  box-shadow:0 4px 15px #edd7e0;
  text-align:center;
}


.stat-number{
  font-size:28px;
  color:#d94f8b;
  font-weight:bold;
}


@media(max-width:600px){

  .info-grid{
    grid-template-columns:1fr;
  }

  .stats{
    grid-template-columns:1fr;
  }

  .row{
    display:block;
  }

  .row button{
    width:100%;
  }

}

</style>

</head>


<body>


<div class="wrap">


<a href="index.html">
← Retour à la boutique
</a>


<h1>
🛍️ Commandes
</h1>


<!-- LOGIN -->

<div
  id="login"
  class="box"
>

<h2>
🔐 Espace Admin
</h2>


<p>
Connecte-toi pour voir les commandes des clientes.
</p>


<form id="loginForm">


<input
  id="email"
  type="email"
  placeholder="Email admin"
  required
>


<input
  id="password"
  type="password"
  placeholder="Mot de passe"
  required
>


<button type="submit">
Se connecter
</button>


<div id="loginMsg"></div>


</form>

</div>


<!-- DASHBOARD -->

<div
  id="dash"
  class="hidden"
>


<div class="row">


<button
  onclick="loadOrders()">

↻ Actualiser

</button>


<button
  class="secondary"
  onclick="logout()">

Se déconnecter

</button>


</div>


<!-- STATS -->

<div class="stats">


<div class="stat">

<div
  id="countOrders"
  class="stat-number">

0

</div>

<div>
Commandes
</div>

</div>


<div class="stat">

<div
  id="countDomicile"
  class="stat-number">

0

</div>

<div>
Domicile
</div>

</div>


<div class="stat">

<div
  id="countUsthb"
  class="stat-number">

0

</div>

<div>
USTHB
</div>

</div>

</div>


<div
  id="orders"
>

<div class="loading">
Chargement des commandes…
</div>

</div>


</div>


</div>


<script>


const db =
  supabase.createClient(
    'https://sydurxdeqjgyuzvotmth.supabase.co',
    'sb_publishable_YtZkRYlml5U_6OtOKcnnyQ_smF0CELK'
  );


const $ =
  id =>
  document.getElementById(id);


const esc =
  s =>
  String(s ?? '').replace(
    /[&<>"']/g,
    c => ({
      '&':'&amp;',
      '<':'&lt;',
      '>':'&gt;',
      '"':'&quot;',
      "'":'&#39;'
    }[c])
  );


const formatDate =
  date => {

    if(!date)
      return 'Date inconnue';

    return new Date(date)
      .toLocaleString(
        'fr-DZ',
        {
          dateStyle:'medium',
          timeStyle:'short'
        }
      );

  };


/*
  CONNEXION ADMIN
*/


async function login(){

  $('loginMsg').className='';
  $('loginMsg').textContent='Connexion…';


  const r =
    await db.auth.signInWithPassword({

      email:
        $('email')
          .value
          .trim(),

      password:
        $('password')
          .value

    });


  if(r.error){

    $('loginMsg').className =
      'error';

    $('loginMsg').textContent =
      '❌ ' + r.error.message;

    return;

  }


  $('login')
    .classList
    .add('hidden');


  $('dash')
    .classList
    .remove('hidden');


  await loadOrders();

}


/*
  FORM LOGIN
*/


$('loginForm').onsubmit =
  e => {

    e.preventDefault();

    login();

  };


/*
  DECONNEXION
*/


async function logout(){

  await db.auth.signOut();

  location.reload();

}


/*
  CHARGEMENT DES COMMANDES
*/


async function loadOrders(){

  $('orders').innerHTML =
    '<div class="loading">🔄 Chargement…</div>';


  /*
    IMPORTANT :

    On récupère exactement
    les colonnes présentes
    dans ta table commandes.
  */


  const r =
    await db
      .from('commandes')
      .select(`
        id,
        coque_id,
        modele,
        nom,
        prenom,
        telephone,
        adresse,
        livraison,
        created_at
      `)
      .order(
        'created_at',
        {
          ascending:false
        }
      );


  /*
    ERREUR
  */


  if(r.error){

    console.error(
      'Erreur chargement commandes:',
      r.error
    );


    $('orders').innerHTML = `

      <div class="error">

        ❌ Impossible de charger les commandes.

        <br><br>

        <strong>
          Erreur Supabase :
        </strong>

        <br>

        ${esc(r.error.message)}

      </div>

    `;

    return;

  }


  const orders =
    r.data || [];


  /*
    STATISTIQUES
  */


  $('countOrders')
    .textContent =
    orders.length;


  $('countDomicile')
    .textContent =
    orders.filter(
      o => o.livraison === 'Domicile'
    ).length;


  $('countUsthb')
    .textContent =
    orders.filter(
      o => o.livraison === 'USTHB'
    ).length;


  /*
    AUCUNE COMMANDE
  */


  if(!orders.length){

    $('orders').innerHTML = `

      <div class="empty">

        <div style="font-size:50px">
          🛍️
        </div>

        <h2>
          Aucune commande
        </h2>

        <p>
          Les nouvelles commandes apparaîtront ici automatiquement.
        </p>

      </div>

    `;

    return;

  }


  /*
    AFFICHAGE
  */


  $('orders').innerHTML =
    orders.map(
      order => `

      <div class="order">


        <div class="order-header">


          <div>

            <h2>
              Commande #${esc(order.id)}
            </h2>

            <span class="muted">

              ${formatDate(order.created_at)}

            </span>

          </div>


          <span class="order-id">

            #${esc(order.id)}

          </span>


        </div>


        <div class="info-grid">


          <div class="info">

            <strong>
              CLIENT
            </strong>

            ${esc(order.nom || '')}
            ${esc(order.prenom || '')}

          </div>


          <div class="info">

            <strong>
              TÉLÉPHONE
            </strong>

            <a
              href="tel:${esc(order.telephone || '')}"
              style="color:#d94f8b;font-weight:bold">

              ${esc(order.telephone || '—')}

            </a>

          </div>


          <div class="info">

            <strong>
              MODÈLE
            </strong>

            📱 ${esc(order.modele || '—')}

          </div>


          <div class="info">

            <strong>
              COQUE ID
            </strong>

            ${esc(order.coque_id || '—')}

          </div>


          <div class="info">

            <strong>
              WILAYA / ADRESSE
            </strong>

            📍 ${esc(order.adresse || '—')}

          </div>


          <div class="info">

            <strong>
              LIVRAISON
            </strong>

            <span class="delivery">

              ${esc(order.livraison || '—')}

            </span>

          </div>


        </div>


      </div>

    `
    ).join('');

}


/*
  VÉRIFIER SI L'ADMIN
  EST DÉJÀ CONNECTÉ
*/


(async function(){

  const r =
    await db.auth.getSession();


  if(
    r.data &&
    r.data.session
  ){

    $('login')
      .classList
      .add('hidden');


    $('dash')
      .classList
      .remove('hidden');


    await loadOrders();

  }

})();


/*
  ACTUALISATION AUTOMATIQUE
  toutes les 10 secondes
*/


setInterval(
  async () => {

    const session =
      await db.auth.getSession();


    if(
      session.data &&
      session.data.session
    ){

      await loadOrders();

    }

  },
  10000
);


</script>


</body>
</html>
