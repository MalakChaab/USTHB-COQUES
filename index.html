<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>USTHB Cases</title><style>body{font-family:Arial;margin:0;background:#fff7fb;color:#4b3040}header{background:#fff;padding:18px;position:sticky;top:0;z-index:10;box-shadow:0 2px 12px #ead2dc}.brand{text-align:center;font-size:28px;color:#d94f8b;font-weight:bold;margin-bottom:14px}.cats{display:flex;justify-content:center;gap:8px;overflow:auto}.cat{border:0;background:#fff0f6;color:#6d4a5b;padding:10px 16px;border-radius:999px;font-weight:bold;white-space:nowrap}.cat.active{background:#d94f8b;color:#fff}.admin-logo{position:absolute;right:14px;top:12px;width:46px;height:46px;border-radius:50%;background:linear-gradient(145deg,#fff,#ffe1ed);color:#d94f8b;text-decoration:none;display:flex;align-items:center;justify-content:center;font-size:25px;border:2px solid #f4b7cf;box-shadow:0 3px 10px #edbfd2}.grid{padding:20px;max-width:1100px;margin:auto;display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:18px}.card{background:white;padding:10px;border-radius:18px;box-shadow:0 3px 15px #edd7e0}.card img{width:100%;aspect-ratio:1;object-fit:cover;border-radius:14px}.card h3{margin:10px 3px}.search{display:block;width:calc(100% - 40px);max-width:900px;margin:18px auto;padding:13px;border:1px solid #efb5cc;border-radius:14px}.empty{text-align:center;grid-column:1/-1;padding:50px}.modal{position:fixed;inset:0;background:#0008;display:none;align-items:center;justify-content:center;padding:15px;z-index:30}.modal.show{display:flex}.modalbox{background:#fff7fb;padding:22px;border-radius:22px;width:100%;max-width:650px;max-height:94vh;overflow:auto}.detail-image{display:block;width:250px;height:250px;object-fit:contain;margin:auto;border-radius:15px;cursor:zoom-in}.gallery{display:flex;gap:8px;justify-content:center;flex-wrap:wrap}.gallery img{width:60px;height:60px;object-fit:cover;border-radius:10px}.model,.btn{border:0;background:#d94f8b;color:#fff;padding:11px 14px;border-radius:12px;font-weight:bold;margin:4px}.btn{width:100%;margin-top:12px}.field{width:100%;padding:12px;margin:6px 0;border:1px solid #efb0ca;border-radius:12px;box-sizing:border-box}.hidden{display:none}.summary{background:#fff;padding:13px;border-radius:14px;margin:8px 0}.price,.total{color:#d94f8b;font-weight:bold}.close{float:right;border:0;background:#fff;border-radius:50%;font-size:22px;width:34px;height:34px}.lightbox{position:fixed;inset:0;background:#000d;display:none;align-items:center;justify-content:center;z-index:50}.lightbox.show{display:flex}.lightbox img{max-width:90vw;max-height:88vh}.ship-options{display:grid;grid-template-columns:1fr 1fr;gap:8px}.ship{background:#fff;border:2px solid #f0c0d2;padding:12px;border-radius:12px}@media(max-width:500px){.grid{grid-template-columns:repeat(2,1fr);gap:12px}.detail-image{width:210px;height:210px}.ship-options{grid-template-columns:1fr}}</style></head><body><header><a class="admin-logo" href="admin.html" aria-label="Admin" title="Admin">👩‍💼</a><div class="brand">USTHB CASES</div><nav class="cats"><button class="cat active" data-cat="cases">CASES</button><button class="cat" data-cat="accessoires">ACCESSOIRES</button><button class="cat" data-cat="ventouses">VENTOUSES</button><button class="cat" data-cat="ipad">IPAD</button></nav></header><input id="search" class="search" placeholder="🔎 Rechercher..."><main id="products" class="grid"><div class="empty">Chargement…</div></main><div id="details" class="modal"><div class="modalbox"><button class="close" onclick="closeDetails()">×</button><div id="detailContent"></div></div></div><div id="order" class="modal"><div class="modalbox"><button class="close" onclick="closeOrder()">×</button><h2>🛍️ Commander</h2><div id="orderProduct" class="summary"></div><form id="orderForm"><input id="firstName" class="field" placeholder="Nom" required><input id="lastName" class="field" placeholder="Prénom" required><input id="phone" class="field" type="tel" placeholder="Numéro de téléphone" required><select id="wilaya" class="field" required><option value="">Choisir la wilaya</option></select><div class="ship-options"><label class="ship"><input type="radio" name="delivery" value="domicile" required> Domicile</label><label class="ship"><input type="radio" name="delivery" value="bureau"> Bureau (Stop Desk)</label><label class="ship"><input type="radio" name="delivery" value="usthb"> USTHB</label></div><textarea id="address" class="field hidden" placeholder="Adresse complète"></textarea><div class="summary">Produit : <b id="productTotal"></b><br>Livraison : <b id="deliveryCost">—</b><br><span class="total">Total : <span id="grandTotal">—</span></span></div><button class="btn" type="submit">Confirmer la commande</button></form><div id="orderMsg" class="summary hidden"></div></div></div><div id="lightbox" class="lightbox" onclick="closeLightbox()"><img id="lightImage"></div><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script>const db=supabase.createClient('https://sydurxdeqjgyuzvotmth.supabase.co','sb_publishable_YtZkRYlml5U_6OtOKcnnyQ_smF0CELK');let all=[],current=null,activeCat='cases',gallery=[];const $=id=>document.getElementById(id),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])),money=n=>Number(n||0).toLocaleString('fr-DZ')+' DA',imgs=v=>String(v||'').split('||').map(x=>x.trim()).filter(Boolean),models=v=>String(v||'').split('||').map(x=>x.trim()).filter(Boolean);const wilayas=['Adrar','Chlef','Laghouat','Oum El Bouaghi','Batna','Béjaïa','Biskra','Béchar','Blida','Bouira','Tamanrasset','Tébessa','Tlemcen','Tiaret','Tizi Ouzou','Alger','Djelfa','Jijel','Sétif','Saïda','Skikda','Sidi Bel Abbès','Annaba','Guelma','Constantine','Médéa','Mostaganem','M’Sila','Mascara','Ouargla','Oran','El Bayadh','Illizi','Bordj Bou Arreridj','Boumerdès','El Tarf','Tindouf','Tissemsilt','El Oued','Khenchela','Souk Ahras','Tipaza','Mila','Aïn Defla','Naâma','Aïn Témouchent','Ghardaïa','Relizane','Timimoun','Bordj Badji Mokhtar','Ouled Djellal','Beni Abbes','In Salah','In Guezzam','Touggourt','Djanet','El M’Ghair','El Meniaa'];const domicile=[1200,750,800,750,750,750,800,1200,650,750,1900,800,750,750,750,500,800,750,750,800,750,750,750,750,750,750,750,750,750,850,750,850,2000,750,750,750,1600,750,850,750,750,650,750,750,850,750,850,750,1450,2000,850,1300,1800,2000,850,2000,850,950];const bureau=[800,450,500,450,450,450,500,800,450,450,1300,500,500,450,450,350,450,450,450,450,450,450,450,450,450,450,450,450,500,600,450,450,1300,450,450,500,1000,500,500,450,550,500,450,450,600,500,600,500,1000,1300,500,900,1100,1300,600,1300,500,600];wilayas.forEach((w,i)=>$('wilaya').insertAdjacentHTML('beforeend',`<option value="${i}">${w}</option>`));async function load(){let r=await db.from('coques').select('*').order('created_at',{ascending:false});if(r.error){$('products').innerHTML='<div class="empty">Erreur de chargement</div>';return}all=(r.data||[]).filter(p=>p.disponible!==false);render()}function render(){let q=$('search').value.toLowerCase().trim();let a=all.filter(p=>String(p.categorie||'cases').toLowerCase()===activeCat&&(p.nom||'').toLowerCase().includes(q));$('products').innerHTML=a.length?a.map(p=>`<article class="card" onclick="openDetails('${p.id}')"><img src="${esc(imgs(p.image_url)[0]||'')}"><h3>${esc(p.nom)}</h3></article>`).join(''):'<div class="empty">Aucun produit dans cette catégorie 💗</div>'}document.querySelectorAll('.cat').forEach(b=>b.onclick=()=>{document.querySelectorAll('.cat').forEach(x=>x.classList.remove('active'));b.classList.add('active');activeCat=b.dataset.cat;render()});function openLight(src,e){e?.stopPropagation();$('lightImage').src=src;$('lightbox').classList.add('show')}function closeLightbox(){$('lightbox').classList.remove('show')}function openDetails(id){current=all.find(p=>String(p.id)===String(id));gallery=imgs(current.image_url);let isCase=activeCat==='cases',ms=models(current.modele);$('detailContent').innerHTML=`<img class="detail-image" src="${esc(gallery[0]||'')}" onclick="openLight(this.src,event)">${gallery.length>1?'<div class="gallery">'+gallery.map(x=>`<img src="${esc(x)}" onclick="openLight(this.src,event)">`).join('')+'</div>':''}<h2>${esc(current.nom)}</h2><div class="price">${money(current.prix)}</div>${isCase?'<h3>📱 Modèles disponibles</h3><div>'+ms.map(m=>`<button class="model">${esc(m)}</button>`).join('')+'</div>':''}<button class="btn" onclick="openOrder(event)">🛍️ COMMANDER</button>`;$('details').classList.add('show')}function closeDetails(){$('details').classList.remove('show')}function openOrder(e){e?.stopPropagation();$('details').classList.remove('show');$('orderProduct').innerHTML=`<b>${esc(current.nom)}</b><br>${money(current.prix)}`;$('productTotal').textContent=money(current.prix);$('deliveryCost').textContent='—';$('grandTotal').textContent=money(current.prix);$('order').classList.add('show')}function closeOrder(){$('order').classList.remove('show')}document.querySelectorAll('input[name=delivery]').forEach(r=>r.onchange=()=>{let d=document.querySelector('input[name=delivery]:checked').value;$('address').classList.toggle('hidden',d!=='domicile');updateTotal()});$('wilaya').onchange=updateTotal;function updateTotal(){let i=Number($('wilaya').value),d=document.querySelector('input[name=delivery]:checked')?.value,c=0;if(d==='domicile'&&i>=0)c=domicile[i]||0;else if(d==='bureau'&&i>=0)c=bureau[i]||0;else if(d==='usthb')c=0;$('deliveryCost').textContent=d?money(c):'—';$('grandTotal').textContent=money(Number(current?.prix||0)+c)}$('orderForm').onsubmit=async e=>{e.preventDefault();let d=document.querySelector('input[name=delivery]:checked')?.value;if(d==='domicile'&&!$('address').value.trim()){alert('Veuillez écrire votre adresse.');return}let i=Number($('wilaya').value);if(!Number.isInteger(i)){alert('Choisissez votre wilaya.');return}let payload={nom_client:$('firstName').value.trim()+' '+$('lastName').value.trim(),telephone:$('phone').value.trim(),wilaya:wilayas[i],adresse:d==='domicile'?$('address').value.trim():null,livraison:d,produit_id:current.id,produit:current.nom,prix_produit:Number(current.prix),frais_livraison:d==='domicile'?domicile[i]:d==='bureau'?bureau[i]:0,total:Number(current.prix)+(d==='domicile'?domicile[i]:d==='bureau'?bureau[i]:0),created_at:new Date().toISOString()};let r=await db.from('commandes').insert(payload);if(r.error){$('orderMsg').textContent='Commande non enregistrée : '+r.error.message;$('orderMsg').classList.remove('hidden');return}$('orderMsg').textContent='Commande envoyée avec succès 💗';$('orderMsg').classList.remove('hidden');$('orderForm').reset();$('address').classList.add('hidden')};load();$('search').oninput=render;</script></body></html>
