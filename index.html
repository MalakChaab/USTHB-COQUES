<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>USTHB Cases</title><style>body{font-family:Arial;margin:0;background:#fff7fb;color:#4b3040}header{background:#fff;padding:18px;position:sticky;top:0;z-index:10;box-shadow:0 2px 12px #ead2dc}.brand{text-align:center;font-size:28px;color:#d94f8b;font-weight:bold;margin-bottom:14px}.cats{display:flex;justify-content:center;gap:8px;overflow:auto}.cat{border:0;background:#fff0f6;color:#6d4a5b;padding:10px 16px;border-radius:999px;font-weight:bold;white-space:nowrap}.cat.active{background:#d94f8b;color:#fff}.admin-logo{position:absolute;right:14px;top:12px;width:46px;height:46px;border-radius:50%;background:linear-gradient(145deg,#fff,#ffe1ed);color:#d94f8b;text-decoration:none;display:flex;align-items:center;justify-content:center;font-size:25px;border:2px solid #f4b7cf;box-shadow:0 3px 10px #edbfd2;transition:.2s}.admin-logo:hover{transform:scale(1.08)}.grid{padding:20px;max-width:1100px;margin:auto;display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:18px}.card{background:white;padding:10px;border-radius:18px;box-shadow:0 3px 15px #edd7e0}.card img{width:100%;aspect-ratio:1;object-fit:cover;border-radius:14px}.card h3{margin:10px 3px}.search{display:block;width:calc(100% - 40px);max-width:900px;margin:18px auto;padding:13px;border:1px solid #efb5cc;border-radius:14px}.empty{text-align:center;grid-column:1/-1;padding:50px}.modal{position:fixed;inset:0;background:#0008;display:none;align-items:center;justify-content:center;padding:15px;z-index:30}.modal.show{display:flex}.modalbox{background:#fff7fb;padding:22px;border-radius:22px;width:100%;max-width:650px;max-height:94vh;overflow:auto}.detail-image{display:block;width:250px;height:250px;object-fit:contain;margin:auto;border-radius:15px;cursor:zoom-in}.gallery{display:flex;gap:8px;justify-content:center;flex-wrap:wrap}.gallery img{width:60px;height:60px;object-fit:cover;border-radius:10px}.model,.btn{border:0;background:#d94f8b;color:#fff;padding:11px 14px;border-radius:12px;font-weight:bold;margin:4px}.btn{width:100%;margin-top:12px}.field{width:100%;padding:12px;margin:6px 0;border:1px solid #efb0ca;border-radius:12px;box-sizing:border-box}.hidden{display:none}.summary{background:#fff;padding:13px;border-radius:14px;margin:8px 0}.price,.total{color:#d94f8b;font-weight:bold}.close{float:right;border:0;background:#fff;border-radius:50%;font-size:22px;width:34px;height:34px}.lightbox{position:fixed;inset:0;background:#000d;display:none;align-items:center;justify-content:center;z-index:50}.lightbox.show{display:flex}.lightbox img{max-width:90vw;max-height:88vh}@media(max-width:500px){.grid{grid-template-columns:repeat(2,1fr);gap:12px}.detail-image{width:210px;height:210px}}</style></head><body><header><a class="admin-logo" href="admin.html" aria-label="Admin" title="Admin">👩‍💼</a><div class="brand">USTHB CASES</div><nav class="cats"><button class="cat active" data-cat="cases">CASES</button><button class="cat" data-cat="accessoires">ACCESSOIRES</button><button class="cat" data-cat="ventouses">VENTOUSES</button><button class="cat" data-cat="ipad">IPAD</button></nav></header><input id="search" class="search" placeholder="🔎 Rechercher..."><main id="products" class="grid"><div class="empty">Chargement…</div></main><div id="details" class="modal"><div class="modalbox"><button class="close" onclick="closeDetails()">×</button><div id="detailContent"></div></div></div><div id="lightbox" class="lightbox" onclick="closeLightbox()"><img id="lightImage"></div><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script>const db=supabase.createClient('https://sydurxdeqjgyuzvotmth.supabase.co','sb_publishable_YtZkRYlml5U_6OtOKcnnyQ_smF0CELK');let all=[],current=null,activeCat='cases',gallery=[];const $=id=>document.getElementById(id),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])),money=n=>Number(n||0).toLocaleString('fr-DZ')+' DA',imgs=v=>String(v||'').split('||').map(x=>x.trim()).filter(Boolean),models=v=>String(v||'').split('||').map(x=>x.trim()).filter(Boolean);async function load(){let r=await db.from('coques').select('*').order('created_at',{ascending:false});if(r.error){$('products').innerHTML='<div class="empty">Erreur de chargement</div>';return}all=(r.data||[]).filter(p=>p.disponible!==false);render()}function render(){let q=$('search').value.toLowerCase().trim();let a=all.filter(p=>{let cat=String(p.categorie||'cases').toLowerCase();let text=(p.nom||'').toLowerCase();return cat===activeCat&&text.includes(q)});$('products').innerHTML=a.length?a.map(p=>`<article class="card" onclick="openDetails('${p.id}')"><img src="${esc(imgs(p.image_url)[0]||'')}"><h3>${esc(p.nom)}</h3></article>`).join(''):'<div class="empty">Aucun produit dans cette catégorie 💗</div>'}document.querySelectorAll('.cat').forEach(b=>b.onclick=()=>{document.querySelectorAll('.cat').forEach(x=>x.classList.remove('active'));b.classList.add('active');activeCat=b.dataset.cat;render()});function openLight(src,e){e?.stopPropagation();$('lightImage').src=src;$('lightbox').classList.add('show')}function closeLightbox(){$('lightbox').classList.remove('show')}function openDetails(id){current=all.find(p=>String(p.id)===String(id));gallery=imgs(current.image_url);let isCase=activeCat==='cases',ms=models(current.modele);$('detailContent').innerHTML=`<img class="detail-image" src="${esc(gallery[0]||'')}" onclick="openLight(this.src,event)">${gallery.length>1?'<div class="gallery">'+gallery.map(x=>`<img src="${esc(x)}" onclick="openLight(this.src,event)">`).join('')+'</div>':''}<h2>${esc(current.nom)}</h2><div class="price">${money(current.prix)}</div>${isCase?'<h3>📱 Modèles disponibles</h3><div>'+ms.map(m=>`<button class="model">${esc(m)}</button>`).join('')+'</div>':'<p>Produit disponible.</p>'}`;$('details').classList.add('show')}function closeDetails(){$('details').classList.remove('show')}load();$('search').oninput=render;</script></body></html>
