<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>USTHB Cases</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
*{box-sizing:border-box}
body{
  margin:0;
  font-family:Arial,sans-serif;
  background:#fff7fa;
  color:#49313d
}
header{
  background:#fff;
  border-bottom:1px solid #f1d7e3;
  position:sticky;
  top:0;
  z-index:20
}
.header{
  max-width:1200px;
  margin:auto;
  padding:15px 20px;
  display:flex;
  align-items:center;
  gap:20px
}
.logo{
  font-size:22px;
  font-weight:900;
  color:#d94f8b;
  white-space:nowrap
}
.search{
  flex:1;
  padding:13px 18px;
  border:1px solid #edc6d7;
  border-radius:30px;
  outline:none;
  font-size:15px
}
.cart-btn{
  background:#d94f8b;
  color:white;
  border:0;
  border-radius:14px;
  padding:12px 17px;
  font-weight:bold;
  cursor:pointer
}
.container{
  max-width:1200px;
  margin:auto;
  padding:25px 20px
}
.hero{
  background:linear-gradient(135deg,#ffe2ed,#fff);
  border-radius:25px;
  padding:30px;
  margin-bottom:25px
}
.hero h1{
  margin:0;
  color:#d94f8b
}
.hero p{color:#866875}
.filters{
  display:flex;
  gap:10px;
  overflow:auto;
  margin-bottom:20px
}
.filter{
  border:1px solid #eac5d5;
  background:white;
  border-radius:20px;
  padding:9px 15px;
  cursor:pointer;
  white-space:nowrap
}
.filter.active{
  background:#d94f8b;
  color:white
}
.grid{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:18px
}
.card{
  background:white;
  border:1px solid #f0dce5;
  border-radius:20px;
  overflow:hidden;
  box-shadow:0 5px 18px #9b526d12
}
.card img{
  width:100%;
  height:230px;
  object-fit:cover;
  background:#fff0f6
}
.card-body{padding:15px}
.card h3{
  margin:0 0 8px;
  font-size:16px
}
.price{
  color:#d94f8b;
  font-weight:900;
  font-size:18px
}
.model{
  color:#8b6b79;
  font-size:12px;
  margin:8px 0
}
.add{
  width:100%;
  background:#d94f8b;
  color:white;
  border:0;
  padding:11px;
  border-radius:12px;
  cursor:pointer;
  font-weight:bold
}
.empty{
  text-align:center;
  padding:50px;
  color:#967684
}

/* PANIER */
.overlay{
  display:none;
  position:fixed;
  inset:0;
  background:#0005;
  z-index:50
}
.overlay.show{display:block}
.cart{
  position:absolute;
  right:0;
  top:0;
  height:100%;
  width:min(500px,100%);
  background:white;
  overflow:auto;
  padding:22px
}
.cart-head{
  display:flex;
  justify-content:space-between;
  align-items:center
}
.close{
  border:0;
  background:#ffe6ef;
  color:#c13d73;
  border-radius:10px;
  padding:8px 12px;
  cursor:pointer
}
.cart-item{
  border:1px solid #efd8e2;
  border-radius:15px;
  padding:12px;
  margin:12px 0
}
.cart-item-top{
  display:flex;
  gap:10px
}
.cart-item img{
  width:65px;
  height:65px;
  border-radius:10px;
  object-fit:cover
}
.qty{
  display:flex;
  align-items:center;
  gap:10px;
  margin-top:10px
}
.qty button{
  width:30px;
  height:30px;
  border:0;
  border-radius:8px;
  background:#ffe3ed;
  color:#c23d73;
  font-weight:bold
}
.remove{
  border:0;
  background:none;
  color:#c23d63;
  cursor:pointer;
  margin-left:auto
}
.total{
  border-top:1px solid #efd8e2;
  margin-top:20px;
  padding-top:20px;
  font-size:23px;
  font-weight:900;
  color:#d94f8b
}
.form input,.form select,.form textarea{
  width:100%;
  margin:6px 0 12px;
  padding:12px;
  border:1px solid #ecc8d7;
  border-radius:12px
}
.form label{
  font-size:13px;
  font-weight:bold
}
.order-btn{
  width:100%;
  padding:14px;
  background:#d94f8b;
  color:white;
  border:0;
  border-radius:13px;
  font-weight:bold;
  cursor:pointer
}
.msg{
  padding:12px;
  border-radius:10px;
  margin:10px 0
}
.success{background:#e4f8eb;color:#247844}
.error{background:#ffe5ec;color:#a32e55}

@media(max-width:900px){
  .grid{grid-template-columns:repeat(3,1fr)}
}
@media(max-width:650px){
  .header{padding:12px}
  .logo{font-size:18px}
  .search{min-width:120px}
  .grid{grid-template-columns:repeat(2,1fr);gap:12px}
  .card img{height:190px}
  .container{padding:15px 12px}
}
</style>
</head>

<body>

<header>
  <div class="header">
    <div class="logo">🎀 USTHB CASES</div>

    <input
      id="search"
      class="search"
      placeholder="🔎 Rechercher une coque ou un modèle (ex: iPhone 13)"
    >

    <button class="cart-btn" onclick="openCart()">
      🛒 Panier <span id="cartCount">0</span>
    </button>
  </div>
</header>

<main class="container">

  <section class="hero">
    <h1>Les coques que tu vas adorer 💗</h1>
    <p>
      Choisis ton modèle, ajoute plusieurs articles au panier
      et commande tout en une seule fois.
    </p>
  </section>

  <div class="filters">
    <button class="filter active" onclick="setFilter('all',this)">
      Tous
    </button>
    <button class="filter" onclick="setFilter('cases',this)">
      📱 Coques
    </button>
    <button class="filter" onclick="setFilter('accessoires',this)">
      ✨ Accessoires
    </button>
    <button class="filter" onclick="setFilter('ventouses',this)">
      🚗 Ventouses
    </button>
    <button class="filter" onclick="setFilter('ipad',this)">
      📱 iPad
    </button>
  </div>

  <div id="products" class="grid">
    <div class="empty">Chargement...</div>
  </div>

</main>

<!-- PANIER -->
<div id="overlay" class="overlay">

  <aside class="cart">

    <div class="cart-head">
      <h2>🛒 Mon panier</h2>
      <button class="close" onclick="closeCart()">✕</button>
    </div>

    <div id="cartItems"></div>

    <div class="total">
      Total : <span id="cartTotal">0 DA</span>
    </div>

    <hr>

    <h3>📦 Informations de livraison</h3>

    <div class="form">

      <label>Nom</label>
      <input id="nom" placeholder="Nom">

      <label>Prénom</label>
      <input id="prenom" placeholder="Prénom">

      <label>Téléphone</label>
      <input id="telephone" type="tel" placeholder="0555...">

      <label>Wilaya</label>
      <select id="wilaya">
        <option value="">Choisir une wilaya</option>
      </select>

      <label>Livraison</label>
      <select id="livraison">
        <option value="">Choisir</option>
        <option value="USTHB">🎓 USTHB</option>
        <option value="Bureau">📦 Bureau</option>
        <option value="Domicile">🏠 Domicile</option>
      </select>

      <label>Adresse</label>
      <textarea
        id="adresse"
        placeholder="Adresse complète si livraison à domicile"
      ></textarea>

      <div id="orderMessage"></div>

      <button class="order-btn" onclick="placeOrder()">
        💗 Passer la commande
      </button>

    </div>

  </aside>

</div>

<script>

const db = supabase.createClient(
  'https://sydurxdeqjgyuzvotmth.supabase.co',
  'sb_publishable_YtZkRYlml5U_6OtOKcnny'
);

let products = [];
let cart = [];
let currentFilter = 'all';

const wilayas = [
'Adrar','Chlef','Laghouat','Oum El Bouaghi','Batna',
'Béjaïa','Biskra','Béchar','Blida','Bouira',
'Tamanrasset','Tébessa','Tlemcen','Tiaret','Tizi Ouzou',
'Alger','Djelfa','Jijel','Sétif','Saïda','Skikda',
'Sidi Bel Abbès','Annaba','Guelma','Constantine','Médéa',
'Mostaganem','M’Sila','Mascara','Ouargla','Oran',
'El Bayadh','Illizi','Bordj Bou Arreridj','Boumerdès',
'El Tarf','Tindouf','Tissemsilt','El Oued','Khenchela',
'Souk Ahras','Tipaza','Mila','Aïn Defla','Naâma',
'Aïn Témouchent','Ghardaïa','Relizane','Timimoun',
'Bordj Badji Mokhtar','Ouled Djellal','Béni Abbès',
'In Salah','In Guezzam','Touggourt','Djanet',
'El M’Ghair','El Meniaa'
];

wilayas.forEach(w=>{
  document.getElementById('wilaya').insertAdjacentHTML(
    'beforeend',
    `<option value="${escapeHtml(w)}">${escapeHtml(w)}</option>`
  );
});

function escapeHtml(v){
  return String(v ?? '').replace(/[&<>"']/g,c=>({
    '&':'&amp;','<':'&lt;','>':'&gt;',
    '"':'&quot;',"'":'&#39;'
  }[c]));
}

function getImages(p){
  return String(p.image_url || '')
    .split('||')
    .map(x=>x.trim())
    .filter(Boolean);
}

function getModels(p){
  return String(p.modele || '')
    .split('||')
    .map(x=>x.trim())
    .filter(Boolean);
}

async function loadProducts(){

  const {data,error} = await db
    .from('coques')
    .select('*')
    .order('created_at',{ascending:false});

  if(error){
    document.getElementById('products').innerHTML =
      `<div class="empty">❌ ${escapeHtml(error.message)}</div>`;
    return;
  }

  products = data || [];
  renderProducts();
}

function renderProducts(){

  const search =
    document.getElementById('search')
      .value.toLowerCase().trim();

  const filtered = products.filter(p=>{

    if(p.disponible === false) return false;

    if(currentFilter !== 'all' &&
       String(p.categorie || 'cases') !== currentFilter){
      return false;
    }

    const text = [
      p.nom,
      p.modele,
      p.categorie
    ].join(' ').toLowerCase();

    /*
      RECHERCHE PAR MODÈLE :
      "iphone 13" trouve une coque dont
      le champ modele contient iPhone 13.
    */
    return text.includes(search);
  });

  if(!filtered.length){
    document.getElementById('products').innerHTML =
      `<div class="empty">
        🔎 Aucun article trouvé.
      </div>`;
    return;
  }

  document.getElementById('products').innerHTML =
    filtered.map(p=>{

      const image = getImages(p)[0] || '';
      const modelList = getModels(p);

      return `
      <article class="card">

        <img src="${escapeHtml(image)}" alt="">

        <div class="card-body">

          <h3>${escapeHtml(p.nom)}</h3>

          <div class="price">
            ${Number(p.prix || 0).toLocaleString('fr-DZ')} DA
          </div>

          <div class="model">
            📱 ${
              modelList.length
                ? escapeHtml(modelList.join(' • '))
                : 'Tous modèles'
            }
          </div>

          <button
            class="add"
            onclick="addToCart('${escapeHtml(p.id)}')"
          >
            🛒 Ajouter au panier
          </button>

        </div>

      </article>
      `;
    }).join('');
}

document.getElementById('search')
.addEventListener('input',renderProducts);

function setFilter(filter,button){

  currentFilter = filter;

  document.querySelectorAll('.filter')
    .forEach(x=>x.classList.remove('active'));

  button.classList.add('active');

  renderProducts();
}

/* ==========================
   PANIER
========================== */

function addToCart(id){

  const product = products.find(
    p=>String(p.id) === String(id)
  );

  if(!product) return;

  /*
    Chaque modèle choisi est conservé dans
    l'article du panier.
  */
  const models = getModels(product);

  let model = models[0] || product.nom;

  if(models.length > 1){

    const answer = prompt(
      'Choisis le modèle :\n\n' +
      models.map((m,i)=>`${i+1}. ${m}`).join('\n')
    );

    const index = Number(answer) - 1;

    if(!Number.isNaN(index) && models[index]){
      model = models[index];
    }else if(answer !== null){
      return;
    }
  }

  const existing = cart.find(
    x =>
      String(x.productId) === String(id) &&
      x.modele === model
  );

  if(existing){
    existing.quantite++;
  }else{

    cart.push({
      productId:product.id,
      nom:product.nom,
      modele:model,
      prix:Number(product.prix || 0),
      image:getImages(product)[0] || '',
      quantite:1
    });

  }

  saveCart();
  renderCart();
  openCart();
}

function increase(index){
  cart[index].quantite++;
  saveCart();
  renderCart();
}

function decrease(index){

  cart[index].quantite--;

  if(cart[index].quantite <= 0){
    cart.splice(index,1);
  }

  saveCart();
  renderCart();
}

function removeItem(index){

  cart.splice(index,1);

  saveCart();
  renderCart();
}

function cartTotal(){

  return cart.reduce(
    (sum,item)=>
      sum + item.prix * item.quantite,
    0
  );
}

function renderCart(){

  document.getElementById('cartCount')
    .textContent =
      cart.reduce(
        (sum,x)=>sum+x.quantite,
        0
      );

  document.getElementById('cartTotal')
    .textContent =
      cartTotal().toLocaleString('fr-DZ') + ' DA';

  if(!cart.length){

    document.getElementById('cartItems').innerHTML =
      `<div class="empty">
        🛒 Ton panier est vide.
      </div>`;

    return;
  }

  document.getElementById('cartItems').innerHTML =
    cart.map((item,index)=>`

      <div class="cart-item">

        <div class="cart-item-top">

          <img src="${escapeHtml(item.image)}">

          <div style="flex:1">

            <b>${escapeHtml(item.nom)}</b>

            <div style="font-size:13px;color:#896b78">
              📱 ${escapeHtml(item.modele)}
            </div>

            <div style="color:#d94f8b;font-weight:bold">
              ${item.prix.toLocaleString('fr-DZ')} DA
            </div>

          </div>

          <button
            class="remove"
            onclick="removeItem(${index})"
          >
            🗑️
          </button>

        </div>

        <div class="qty">

          <button onclick="decrease(${index})">
            −
          </button>

          <b>${item.quantite}</b>

          <button onclick="increase(${index})">
            +
          </button>

          <span style="margin-left:auto;font-weight:bold">
            ${(item.prix * item.quantite)
              .toLocaleString('fr-DZ')} DA
          </span>

        </div>

      </div>

    `).join('');
}

function saveCart(){
  localStorage.setItem(
    'usthb_cart',
    JSON.stringify(cart)
  );
}

function loadCart(){

  try{
    cart =
      JSON.parse(
        localStorage.getItem('usthb_cart')
      ) || [];
  }catch{
    cart=[];
  }

  renderCart();
}

function openCart(){
  document.getElementById('overlay')
    .classList.add('show');
}

function closeCart(){
  document.getElementById('overlay')
    .classList.remove('show');
}

/* ==========================
   COMMANDE
========================== */

function deliveryPrice(){

  const type =
    document.getElementById('livraison').value;

  if(type === 'USTHB') return 0;
  if(type === 'Bureau') return 500;
  if(type === 'Domicile') return 700;

  return 0;
}

async function placeOrder(){

  if(!cart.length){

    showMessage(
      '❌ Ton panier est vide.',
      true
    );

    return;
  }

  const nom =
    document.getElementById('nom').value.trim();

  const prenom =
    document.getElementById('prenom').value.trim();

  const telephone =
    document.getElementById('telephone').value.trim();

  const wilaya =
    document.getElementById('wilaya').value;

  const livraison =
    document.getElementById('livraison').value;

  const adresse =
    document.getElementById('adresse').value.trim();

  if(!nom || !prenom || !telephone ||
     !wilaya || !livraison){

    showMessage(
      '❌ Remplis tous les champs obligatoires.',
      true
    );

    return;
  }

  if(livraison === 'Domicile' && !adresse){

    showMessage(
      '❌ Ajoute ton adresse.',
      true
    );

    return;
  }

  const livraisonCost = deliveryPrice();

  const total =
    cartTotal() + livraisonCost;

  /*
    On conserve une adresse lisible
    avec la wilaya.
  */
  const finalAddress =
    livraison === 'Domicile'
      ? `${adresse} — ${wilaya}`
      : wilaya;

  /*
    Création de la commande principale.
  */
  const {data:order,error:orderError} =
    await db
      .from('commandes')
      .insert({
        nom,
        prenom,
        telephone,
        adresse:finalAddress,
        livraison,
        statut:'En attente',
        total
      })
      .select()
      .single();

  if(orderError){

    showMessage(
      '❌ Commande non enregistrée : ' +
      orderError.message,
      true
    );

    return;
  }

  /*
    Tous les articles du panier
    deviennent des lignes liées
    à cette commande.
  */
  const articles = cart.map(item=>({

    commande_id:order.id,

    produit_id:item.productId,

    nom_produit:item.nom,

    modele:item.modele,

    prix:item.prix,

    quantite:item.quantite,

    image_url:item.image

  }));

  const {error:articleError} =
    await db
      .from('commande_articles')
      .insert(articles);

  if(articleError){

    /*
      Si les articles n'ont pas pu être enregistrés,
      on supprime la commande principale
      pour éviter une commande vide.
    */
    await db
      .from('commandes')
      .delete()
      .eq('id',order.id);

    showMessage(
      '❌ Les articles n’ont pas pu être enregistrés : ' +
      articleError.message,
      true
    );

    return;
  }

  showMessage(
    '✅ Commande enregistrée avec succès !',
    false
  );

  cart=[];
  saveCart();
  renderCart();

  document.getElementById('nom').value='';
  document.getElementById('prenom').value='';
  document.getElementById('telephone').value='';
  document.getElementById('wilaya').value='';
  document.getElementById('livraison').value='';
  document.getElementById('adresse').value='';
}

function showMessage(text,error){

  const el =
    document.getElementById('orderMessage');

  el.className =
    'msg ' +
    (error ? 'error' : 'success');

  el.textContent=text;
}

loadCart();
loadProducts();

</script>

</body>
</html>
