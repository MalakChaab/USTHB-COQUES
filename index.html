<!doctype html>
<html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>USTHB Coques</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><style>
*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:#fff7fb;color:#4b3040}header{background:#ffd6e8;padding:24px;text-align:center;position:sticky;top:0;z-index:5;box-shadow:0 2px 12px #e9bfd0}.logo{font-size:28px;font-weight:800;color:#d94f8b}.tag{font-size:13px;margin-top:5px}main{max-width:1100px;margin:auto;padding:24px}.search{width:100%;padding:15px;border:2px solid #f2a7c8;border-radius:18px;font-size:16px;outline:none}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:18px;margin-top:24px}.card{background:#fff;border-radius:20px;padding:14px;box-shadow:0 4px 18px #e9bfd0;cursor:pointer;transition:.2s}.card:hover{transform:translateY(-3px)}.card img{width:100%;aspect-ratio:1;object-fit:cover;border-radius:15px;background:#ffe8f1}.card h3{margin:12px 3px 2px;font-size:17px}.stars{color:#e99b21;letter-spacing:2px}.small{color:#9b6d82;font-size:13px}.price{font-weight:800;color:#d94f8b;font-size:18px}.modal{position:fixed;inset:0;background:#0006;display:none;align-items:center;justify-content:center;padding:15px;z-index:20}.modal.show{display:flex}.modalbox{background:#fff7fb;border-radius:24px;max-width:650px;width:100%;max-height:92vh;overflow:auto;padding:22px}.modalbox>img{width:100%;max-height:300px;object-fit:contain;border-radius:18px;background:#ffe8f1}.close{float:right;border:0;background:white;border-radius:50%;width:35px;height:35px;font-size:20px}.models{display:flex;flex-wrap:wrap;gap:8px}.model{border:1px solid #edb1cb;background:#fff;padding:8px 12px;border-radius:20px;cursor:pointer}.btn{border:0;background:#d94f8b;color:white;padding:12px 16px;border-radius:14px;font-weight:700;cursor:pointer;width:100%;margin-top:10px}.field{width:100%;padding:12px;margin:6px 0;border:1px solid #efb0ca;border-radius:12px}.review{background:white;padding:12px;border-radius:14px;margin:8px 0}.empty{text-align:center;padding:50px}.admin{position:fixed;right:15px;bottom:15px;background:white;border:1px solid #f2a7c8;padding:10px 14px;border-radius:15px;color:#d94f8b;text-decoration:none;z-index:10}footer{text-align:center;padding:30px;color:#9b6d82}@media(max-width:500px){main{padding:16px}.modalbox{padding:16px}.grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.card{padding:10px}}
</style></head><body><header><div class="logo">🎀 USTHB_COQUES</div><div class="tag">PHONE CASES & ACCESSOIRES</div></header><main><h1>Nos coques 💗</h1><input id="search" class="search" placeholder="🔎 Rechercher une coque..."><div id="products" class="grid"><div class="empty">Chargement…</div></div></main><a class="admin" href="admin.html">🔐 Admin</a><footer>Livraison USTHB • Bureau • Domicile</footer>
<div id="details" class="modal"><div class="modalbox"><button class="close" onclick="closeModal()">×</button><div id="detailContent"></div></div></div>
<div id="order" class="modal"><div class="modalbox"><button class="close" onclick="closeOrder()">×</button><h2>🛍️ Commander</h2><form id="orderForm"><input class="field" id="prenom" required placeholder="Prénom"><input class="field" id="nom" required placeholder="Nom"><input class="field" id="tel" required placeholder="Numéro de téléphone"><input class="field" id="adresse" required placeholder="Adresse"><select class="field" id="livraison" required><option value="">Choisir la livraison</option><option>Bureau</option><option>Domicile</option><option>USTHB</option></select><div id="chosen"></div><button class="btn">Confirmer la commande</button></form><div id="orderMsg" class="small"></div></div></div>
<script>
const SUPABASE_URL='https://sydurxdeqjgyuzvotmth.supabase.co',SUPABASE_KEY='sb_publishable_YtZkRYlml5U_6OtOKcnnyQ_smF0CELK';const db=window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY);let all=[],current=null,selectedModel='';const $=id=>document.getElementById(id);const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
async function load(){let {data,error}=await db.from('coques').select('*').eq('disponible',true).order('created_at',{ascending:false});if(error){$('products').innerHTML='<div class="empty">Erreur de chargement. Vérifie Supabase et GitHub Pages.</div>';console.error(error);return}all=data||[];render()}
async function getReviews(id){let {data}=await db.from('avis').select('note,commentaire,created_at').eq('coque_id',id).order('created_at',{ascending:false});return data||[]}
function stars(n){return '★'.repeat(Math.round(n))+'☆'.repeat(5-Math.round(n))}
async function render(){let q=$('search').value.toLowerCase().trim();let a=all.filter(x=>(x.nom||'').toLowerCase().includes(q));$('products').innerHTML=a.length?a.map(x=>`<article class="card" onclick="openDetails('${x.id}')"><img src="${esc(x.image_url)||''}" onerror="this.style.visibility='hidden'"><h3>${esc(x.nom)}</h3></article>`).join(''):'<div class="empty">Aucune coque trouvée 💗</div>'}
async function openDetails(id){current=all.find(x=>String(x.id)===String(id));if(!current)return;selectedModel='';let {data:models,error}=await db.from('coque_modeles').select('modele').eq('coque_id',current.id).order('modele');let modelList=(!error&&models?.length)?models.map(x=>x.modele):[current.modele];let reviews=await getReviews(current.id);let avg=reviews.length?reviews.reduce((s,r)=>s+r.note,0)/reviews.length:0;$('detailContent').innerHTML=`<img src="${esc(current.image_url)||''}" onerror="this.style.visibility='hidden'"><h2>${esc(current.nom)}</h2><div class="price">${Number(current.prix).toLocaleString('fr-DZ')} DA</div><div class="stars">${stars(avg)}</div><p>${avg?avg.toFixed(1)+' / 5 ('+reviews.length+' avis)':'Pas encore d’avis'}</p><h3>📱 Téléphones disponibles</h3><div class="models">${modelList.map(m=>`<button class="model" onclick="chooseModel('${esc(m).replaceAll("'","&#39;")}')">${esc(m)}</button>`).join('')}</div><button class="btn" onclick="startOrder()">Commander</button><h3>💬 Avis des clients</h3>${reviews.length?reviews.map(r=>`<div class="review"><span class="stars">${stars(r.note)}</span><br>${esc(r.commentaire||'')}</div>`).join(''):'<div class="small">Les premiers avis apparaîtront ici.</div>'}`;$('details').classList.add('show')}
function chooseModel(m){selectedModel=m;startOrder()}function startOrder(){if(!selectedModel){alert('Choisis d’abord ton modèle de téléphone.');return}$('details').classList.remove('show');$('chosen').innerHTML='<p><b>'+esc(current.nom)+'</b> — '+esc(selectedModel)+'</p>';$('orderMsg').textContent='';$('order').classList.add('show')}function closeModal(){$('details').classList.remove('show')}function closeOrder(){$('order').classList.remove('show')}
$('orderForm').addEventListener('submit',async e=>{e.preventDefault();let payload={coque_id:current.id,modele:selectedModel,nom:$('nom').value.trim(),prenom:$('prenom').value.trim(),telephone:$('tel').value.trim(),adresse:$('adresse').value.trim(),livraison:$('livraison').value};let {data,error}=await db.from('commandes').insert(payload).select('id').single();if(error){$('orderMsg').textContent='Impossible de commander : '+error.message;return}localStorage.setItem('last_order_'+current.id,String(data.id));$('orderMsg').textContent='Commande enregistrée 💗';e.target.reset()});$('search').addEventListener('input',render);load();
</script></body></html>
