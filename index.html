<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>USTHB Coques</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:#fff7fb;color:#4b3040}header{background:#ffd6e8;padding:22px;text-align:center;position:sticky;top:0;z-index:5;box-shadow:0 2px 12px #e9bfd0}.logo{font-size:28px;font-weight:800;color:#d94f8b}.tag{font-size:13px;margin-top:5px}main{max-width:1100px;margin:auto;padding:24px}.search{width:100%;padding:15px;border:2px solid #f2a7c8;border-radius:18px;font-size:16px;outline:none}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:18px;margin-top:24px}.card{background:#fff;border-radius:20px;padding:14px;box-shadow:0 4px 18px #e9bfd0}.card img{width:100%;aspect-ratio:1;object-fit:cover;border-radius:15px;background:#ffe8f1}.price{font-weight:800;color:#d94f8b;font-size:18px}.btn{border:0;background:#d94f8b;color:white;padding:11px 15px;border-radius:14px;width:100%;font-weight:700;cursor:pointer}.empty{text-align:center;padding:50px}.admin{position:fixed;right:15px;bottom:15px;background:white;border:1px solid #f2a7c8;padding:10px 14px;border-radius:15px;color:#d94f8b;text-decoration:none;z-index:10}footer{text-align:center;padding:30px;color:#9b6d82}@media(max-width:500px){main{padding:16px}}
</style></head>
<body><header><div class="logo">🎀 USTHB_COQUES</div><div class="tag">PHONE CASES & ACCESSOIRES</div></header>
<main><h1>Nos articles 💗</h1><input id="search" class="search" placeholder="🔎 Rechercher : iPhone 13, Samsung A55..."><div id="products" class="grid"><div class="empty">Chargement…</div></div></main>
<a class="admin" href="admin.html">🔐 Admin</a><footer>Livraison USTHB gratuite • Domicile & bureau disponibles</footer>
<script>
const SUPABASE_URL='https://sydurxdeqjgyuzvotmth.supabase.co';
const SUPABASE_KEY='sb_publishable_YtZkRYlml5U_6OtOKcnnyQ_smF0CELK';
const db=window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY);
let all=[];
const fallback='data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 width=%22500%22 height=%22500%22%3E%3Crect width=%22100%25%22 height=%22100%25%22 fill=%22%23ffe8f1%22/%3E%3Ctext x=%2250%25%22 y=%2250%25%22 text-anchor=%22middle%22 dominant-baseline=%22middle%22 font-size=%2240%22 fill=%22%23d94f8b%22%3EUSTHB%20COQUES%3C/text%3E%3C/svg%3E';
async function load(){const {data,error}=await db.from('products').select('*').order('created_at',{ascending:false});if(error){document.getElementById('products').innerHTML='<div class="empty">Impossible de charger les articles. Vérifie la table <b>products</b> dans Supabase.</div>';return}all=data||[];render()}
function render(){let q=document.getElementById('search').value.toLowerCase().trim();let a=all.filter(x=>((x.name||'')+' '+(x.model||'')).toLowerCase().includes(q));document.getElementById('products').innerHTML=a.length?a.map(x=>`<article class="card"><img src="${x.image_url||x.img||fallback}" onerror="this.src='${fallback}'"><h3>${x.name||'Coque'}</h3><div>${x.model||''}</div><p class="price">${Number(x.price||0).toLocaleString('fr-DZ')} DA</p><button class="btn" onclick="order('${String(x.name||'').replaceAll("'","\\'")}','${String(x.model||'').replaceAll("'","\\'")}')">Commander</button></article>`).join(''):'<div class="empty">Aucun article trouvé 💗</div>'}
function order(n,m){alert(`Commande : ${n} — ${m}\nLe formulaire de commande sera ajouté ensuite.`)}
document.getElementById('search').addEventListener('input',render);load();
</script></body></html>
