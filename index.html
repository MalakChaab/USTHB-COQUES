<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>USTHB Coques</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><style>*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:#fff7fb;color:#49313f}header{background:#ffd9e9;padding:22px;text-align:center;box-shadow:0 2px 15px #edc3d3;position:sticky;top:0;z-index:5}.logo{font-size:28px;font-weight:900;color:#d84d89}.tag{font-size:12px;letter-spacing:1px;margin-top:5px}main{max-width:1100px;margin:auto;padding:24px 18px}.search{width:100%;padding:15px;border:2px solid #f0abc8;border-radius:18px;font-size:16px}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:18px;margin-top:24px}.card{background:#fff;border-radius:22px;padding:13px;box-shadow:0 5px 20px #e8c8d5;cursor:pointer}.card img{width:100%;aspect-ratio:1;object-fit:cover;border-radius:17px;background:#ffeaf2}.card h3{margin:10px 0 4px;font-size:17px}.price{color:#d84d89;font-size:18px;font-weight:900;margin:8px 0}.stars{color:#f0a000;letter-spacing:2px}.small{color:#9a7182;font-size:13px}.modal{position:fixed;inset:0;background:#0008;display:none;align-items:flex-end;justify-content:center;z-index:20}.modal.show{display:flex}.sheet{background:#fff7fb;width:min(680px,100%);max-height:94vh;overflow:auto;border-radius:28px 28px 0 0;padding:22px}.close{float:right;border:0;background:#f7d7e5;border-radius:50%;width:38px;height:38px;font-size:20px}.sheet img{width:180px;height:180px;object-fit:cover;border-radius:20px;display:block;margin:10px auto;background:#ffeaf2}.models{display:flex;flex-wrap:wrap;gap:8px}.model{padding:9px 12px;background:white;border:1px solid #e8abc3;border-radius:13px;cursor:pointer}.btn{border:0;background:#d84d89;color:white;padding:13px;border-radius:14px;width:100%;font-weight:800;cursor:pointer;margin-top:10px}.field{width:100%;padding:13px;margin:6px 0;border:1px solid #e2b4c8;border-radius:12px;font-size:15px}.review{background:white;padding:12px;border-radius:15px;margin:8px 0}.choices{display:flex;gap:8px;flex-wrap:wrap}.choices label{background:white;border:1px solid #e2b4c8;padding:10px;border-radius:12px}.empty{text-align:center;padding:50px}.admin{position:fixed;right:14px;bottom:14px;background:#fff;border:1px solid #e8abc3;color:#d84d89;padding:10px 14px;border-radius:15px;text-decoration:none;z-index:10}footer{text-align:center;padding:30px;color:#997084}@media(max-width:500px){.grid{grid-template-columns:repeat(2,1fr);gap:12px}.card{padding:9px}.sheet{padding:17px}}</style></head><body><header><div class="logo">🎀 USTHB COQUES</div><div class="tag">COQUES • MODÈLES • AVIS</div></header><main><input id="search" class="search" placeholder="🔎 Rechercher un modèle de téléphone..."><div id="products" class="grid"><div class="empty">Chargement…</div></div></main><a class="admin" href="admin.html">🔐 Admin</a><footer>Livraison USTHB • Bureau • Domicile</footer><div id="modal" class="modal" onclick="if(event.target.id==='modal')closeModal()"><div class="sheet"><button class="close" onclick="closeModal()">×</button><div id="content"></div></div></div><script>
const db=window.supabase.createClient('https://sydurxdeqjgyuzvotmth.supabase.co','sb_publishable_YtZkRYlml5U_6OtOKcnnyQ_smF0CELK');let all=[],current=null,chosenModel='';const $=id=>document.getElementById(id);const fallback='data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 width=%22500%22 height=%22500%22%3E%3Crect width=%22100%25%22 height=%22100%25%22 fill=%22%23ffe8f1%22/%3E%3Ctext x=%2250%25%22 y=%2250%25%22 text-anchor=%22middle%22 dominant-baseline=%22middle%22 font-size=%2235%22 fill=%22%23d84d89%22%3EUSTHB%20COQUES%3C/text%3E%3C/svg%3E';function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function stars(n){n=Math.round(Number(n)||0);return '★'.repeat(n)+'☆'.repeat(5-n)}async function load(){let{data,error}=await db.from('coques').select('*').eq('disponible',true).order('created_at',{ascending:false});if(error){$('products').innerHTML='<div class="empty">Erreur de chargement.<br><small>'+esc(error.message)+'</small></div>';return}all=data||[];await enrich();render()}async function enrich(){if(!all.length)return;let{data:reviews}=await db.from('avis').select('coque_id,note');let map={};(reviews||[]).forEach(r=>{if(!map[r.coque_id])map[r.coque_id]=[];map[r.coque_id].push(r.note)});all.forEach(p=>{let a=map[p.id]||[];p.avg=a.length?a.reduce((x,y)=>x+y,0)/a.length:0;p.count=a.length})}function render(){let q=$('search').value.toLowerCase().trim(),a=all.filter(x=>(x.nom+' '+x.modele).toLowerCase().includes(q));$('products').innerHTML=a.length?a.map(x=>`<article class="card" onclick="openProduct(${x.id})"><img src="${esc(x.image_url)||fallback}" onerror="this.src='${fallback}'"><h3>${esc(x.modele)}</h3><div class="price">${Number(x.prix||0).toLocaleString('fr-DZ')} DA</div><div class="stars">${stars(x.avg)}</div><div class="small">${x.count?x.avg.toFixed(1)+' / 5 ('+x.count+' avis)':'Pas encore d’avis'}</div></article>`).join(''):'<div class="empty">Aucun modèle trouvé 💗</div>'}async function openProduct(id){current=all.find(x=>x.id==id);if(!current)return;chosenModel='';let{data:models}=await db.from('coque_modeles').select('modele').eq('coque_id',id).order('modele');let{data:reviews}=await db.from('avis').select('note,commentaire,created_at').eq('coque_id',id).order('created_at',{ascending:false});let ms=(models&&models.length?models.map(x=>x.modele):[current.modele]);let av=reviews?.length?reviews.reduce((s,r)=>s+r.note,0)/reviews.length:0;$('content').innerHTML=`<img src="${esc(current.image_url)||fallback}" onerror="this.src='${fallback}'"><h2>${esc(current.nom)}</h2><div class="price">${Number(current.prix).toLocaleString('fr-DZ')} DA</div><div class="stars">${stars(av)}</div><div class="small">${reviews?.length?av.toFixed(1)+' / 5 ('+reviews.length+' avis)':'Pas encore d’avis'}</div><h3>📱 Téléphones disponibles</h3><div class="models">${ms.map(m=>`<button class="model" onclick="selectModel(${JSON.stringify(m)})">${esc(m)}</button>`).join('')}</div><h3>💬 Avis</h3>${reviews?.length?reviews.map(r=>`<div class="review"><span class="stars">${stars(r.note)}</span><br>${esc(r.commentaire||'')}</div>`).join(''):'<div class="small">Les avis apparaîtront après les commandes.</div>'}<button class="btn" onclick="startOrder()">🛍️ Commander</button>`;$('modal').classList.add('show')}function selectModel(m){chosenModel=m;document.querySelectorAll('.model').forEach(b=>b.style.fontWeight=b.textContent===m?'800':'400')}function startOrder(){if(!chosenModel){alert('Choisis d’abord le téléphone 📱');return}$('content').innerHTML=`<h2>🛍️ Commander</h2><p><b>${esc(current.nom)}</b> — ${esc(chosenModel)} — ${Number(current.prix).toLocaleString('fr-DZ')} DA</p><input id="prenom" class="field" placeholder="Prénom"><input id="nom" class="field" placeholder="Nom"><input id="tel" class="field" type="tel" placeholder="Numéro de téléphone"><input id="adresse" class="field" placeholder="Adresse"><h3>🚚 Livraison</h3><div class="choices"><label><input type="radio" name="liv" value="Bureau"> Bureau</label><label><input type="radio" name="liv" value="Domicile"> Domicile</label><label><input type="radio" name="liv" value="USTHB"> USTHB</label></div><button class="btn" onclick="submitOrder()">Confirmer la commande</button><div id="msg" class="small"></div>`}async function submitOrder(){let prenom=$('prenom').value.trim(),nom=$('nom').value.trim(),telephone=$('tel').value.trim(),adresse=$('adresse').value.trim(),liv=document.querySelector('input[name=liv]:checked')?.value;if(!prenom||!nom||!telephone||!adresse||!liv){$('msg').textContent='Remplis tous les champs 💗';return}let{data,error}=await db.from('commandes').insert({coque_id:current.id,modele:chosenModel,nom,prenom,telephone,adresse,livraison:liv}).select('id').single();if(error){$('msg').textContent='Erreur : '+error.message;return}localStorage.setItem('last_order_'+current.id,data.id);$('content').innerHTML=`<h2>💗 Commande enregistrée !</h2><p>Merci ${esc(prenom)}. Ta commande <b>#${data.id}</b> a bien été enregistrée.</p><p>Tu peux laisser ton avis après ta commande :</p><div class="choices">${[1,2,3,4,5].map(n=>`<label><input type="radio" name="rating" value="${n}"> ${n} ⭐</label>`).join('')}</div><textarea id="comment" class="field" rows="3" placeholder="Ton avis..."></textarea><button class="btn" onclick="review(${data.id},${current.id})">Envoyer mon avis</button>`}async function review(cid,coid){let note=document.querySelector('input[name=rating]:checked')?.value;if(!note){alert('Choisis une note ⭐');return}let{error}=await db.from('avis').insert({commande_id:cid,coque_id:coid,note:Number(note),commentaire:$('comment').value.trim()});if(error){alert('Erreur : '+error.message);return}alert('Merci pour ton avis ⭐');closeModal();load()}function closeModal(){$('modal').classList.remove('show');current=null}$('search').addEventListener('input',render);load();</script></body></html>
