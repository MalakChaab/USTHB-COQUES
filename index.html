<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>USTHB Cases</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet"><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><style>*{box-sizing:border-box}body{margin:0;font-family:'Plus Jakarta Sans',sans-serif;background:#fff7fb;color:#4b3040}header{background:#fff;padding:18px 16px 0;box-shadow:0 2px 14px #ead2dc;position:sticky;top:0;z-index:10}.brand{font-family:Fredoka,sans-serif;text-align:center;font-size:28px;color:#d94f8b;font-weight:600;margin-bottom:14px}.cats{display:flex;justify-content:center;gap:8px;overflow-x:auto;padding:0 4px 14px;scrollbar-width:none}.cats::-webkit-scrollbar{display:none}.cat{white-space:nowrap;border:0;background:#fff0f6;color:#6d4a5b;padding:10px 16px;border-radius:999px;font:600 13px 'Plus Jakarta Sans';cursor:pointer}.cat.active{background:#d94f8b;color:#fff}.search{display:block;width:min(900px,calc(100% - 32px));margin:20px auto;padding:14px 17px;border:1px solid #efb5cc;border-radius:16px;font:500 15px 'Plus Jakarta Sans';outline:none}.grid{max-width:1100px;margin:0 auto;padding:0 16px 30px;display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:18px}.card{background:#fff;border-radius:20px;padding:12px;box-shadow:0 4px 18px #edd7e0;cursor:pointer}.card img{width:100%;aspect-ratio:1;object-fit:cover;border-radius:15px}.card h3{margin:11px 3px 3px;font-size:16px}.empty{text-align:center;padding:60px 20px;grid-column:1/-1;color:#9b7183}.admin{position:fixed;right:15px;bottom:15px;background:#fff;border:1px solid #efb5cc;padding:10px 14px;border-radius:15px;color:#d94f8b;text-decoration:none;font-weight:700;z-index:15}.modal{position:fixed;inset:0;background:#0008;display:none;align-items:center;justify-content:center;padding:15px;z-index:30}.modal.show{display:flex}.modalbox{background:#fff7fb;border-radius:24px;max-width:680px;width:100%;max-height:94vh;overflow:auto;padding:22px}.detail-image{display:block;width:260px;height:260px;object-fit:contain;border-radius:18px;margin:0 auto 12px;cursor:zoom-in}.gallery{display:flex;gap:8px;justify-content:center;flex-wrap:wrap}.gallery img{width:62px;height:62px;object-fit:cover;border-radius:10px;cursor:pointer}.close{float:right;border:0;background:#fff;border-radius:50%;width:35px;height:35px;font-size:20px}.models{display:flex;flex-wrap:wrap;gap:8px}.model{border:1px solid #edb1cb;background:#fff;padding:9px 12px;border-radius:20px;cursor:pointer}.price,.total{font-weight:800;color:#d94f8b}.btn{border:0;background:#d94f8b;color:#fff;padding:12px 16px;border-radius:14px;font-weight:700;cursor:pointer;width:100%;margin-top:10px}.field{width:100%;padding:12px;margin:6px 0;border:1px solid #efb0ca;border-radius:12px;font:500 14px 'Plus Jakarta Sans'}.hidden{display:none}.summary{background:#fff;padding:14px;border-radius:15px;margin:10px 0}.lightbox{position:fixed;inset:0;background:#000d;display:none;align-items:center;justify-content:center;z-index:50}.lightbox.show{display:flex}.lightbox img{max-width:90vw;max-height:88vh}.lightclose{position:absolute;right:20px;top:15px;background:#ffffff33;color:#fff;border:0;border-radius:50%;width:42px;height:42px;font-size:28px}@media(max-width:500px){.grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.card{padding:9px}.detail-image{width:210px;height:210px}.modalbox{padding:16px}}</style></head><body><header><div class="brand">USTHB CASES</div><nav class="cats"><button class="cat active" data-cat="all">CASES</button><button class="cat" data-cat="accessoires">ACCESSOIRES</button><button class="cat" data-cat="ventouses">VENTOUSES</button><button class="cat" data-cat="ipad">IPAD</button></nav></header><input id="search" class="search" placeholder="🔎 Rechercher..."><main id="products" class="grid"><div class="empty">Chargement…</div></main><a class="admin" href="admin.html">🔐 Admin</a><div id="details" class="modal"><div class="modalbox"><button class="close" onclick="closeDetails()">×</button><div id="detailContent"></div></div></div><div id="lightbox" class="lightbox" onclick="closeLightbox()"><button class="lightclose" onclick="closeLightbox(event)">×</button><img id="lightImage"></div><div id="order" class="modal"><div class="modalbox"><button class="close" onclick="closeOrder()">×</button><h2>🛍️ Commander</h2><form id="orderForm"><input class="field" id="prenom" required placeholder="Prénom"><input class="field" id="nom" required placeholder="Nom"><input class="field" id="tel" required placeholder="Numéro de téléphone"><div id="chosen"></div><select class="field" id="wilaya" required><option value="">Choisir votre wilaya</option></select><select class="field" id="livraison" required><option value="">Choisir la livraison</option><option value="bureau">🏢 Bureau (Stop Desk)</option><option value="domicile">🏠 Domicile</option><option value="usthb">🎓 USTHB</option></select><input class="field hidden" id="adresse" placeholder="Adresse"><div id="deliveryPrice" class="summary">Choisis la wilaya et la livraison.</div><div class="summary">Coque : <b id="casePrice">0 DA</b><br>Livraison : <b id="shipPrice">0 DA</b><hr><div class="total">Total : <span id="total">0 DA</span></div></div><button class="btn">Confirmer la commande</button></form><p id="orderMsg"></p></div></div><script>const U='https://sydurxdeqjgyuzvotmth.supabase.co',K='sb_publishable_YtZkRYlml5U_6OtOKcnnyQ_smF0CELK',db=supabase.createClient(U,K);let all=[],current=null,selectedModel='',gallery=[],activeCat='all';const $=x=>document.getElementById(x),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])),money=n=>Number(n||0).toLocaleString('fr-DZ')+' DA';const models=v=>String(v||'').split('||').map(x=>x.trim()).filter(Boolean),imgs=v=>String(v||'').split('||').map(x=>x.trim()).filter(Boolean),hasStock=p=>p.stock&&typeof p.stock==='object'&&!Array.isArray(p.stock)&&Object.keys(p.stock).length,available=p=>{let ms=models(p.modele);return hasStock(p)?ms.filter(m=>Number(p.stock[m]||0)>0):ms};const W=[['Adrar',1200,800],['Chlef',750,450],['Laghouat',800,500],['Oum El Bouaghi',750,450],['Batna',750,450],['Béjaïa',750,450],['Biskra',800,500],['Béchar',1200,800],['Blida',650,450],['Bouira',750,450],['Tamanrasset',1900,1300],['Tébessa',800,500],['Tlemcen',750,500],['Tiaret',750,450],['Tizi Ouzou',750,450],['Alger',500,350],['Djelfa',800,450],['Jijel',750,450],['Sétif',750,450],['Saïda',800,450],['Skikda',750,450],['Sidi Bel Abbès',750,450],['Annaba',750,450],['Guelma',750,450],['Constantine',750,450],['Médéa',750,450],['Mostaganem',750,450],['M’Sila',750,450],['Mascara',850,600],['Ouargla',750,450],['Oran',850,450],['El Bayadh',2000,1300],['Illizi',750,450],['Bordj Bou Arreridj',750,450],['Boumerdès',750,500],['El Tarf',750,500],['Tindouf',1600,1000],['Tissemsilt',750,500],['El Oued',850,500],['Khenchela',750,450],['Souk Ahras',750,550],['Tipaza',650,500],['Mila',750,450],['Aïn Defla',750,450],['Naâma',850,600],['Aïn Témouchent',750,500],['Ghardaïa',850,600],['Relizane',750,500],['Timimoun',1450,1000],['Bordj Badji Mokhtar',2000,1300],['Ouled Djellal',850,500],['Beni Abbes',1300,900],['In Salah',1800,1100],['In Guezzam',2000,1300],['Touggourt',850,600],['Djanet',2000,1300],['El M’Ghair',850,500],['El Meniaa',950,600]];W.forEach(w=>{let o=document.createElement('option');o.value=w[0];o.textContent=w[0];$('wilaya').appendChild(o)});function ship(){let w=W.find(x=>x[0]===$('wilaya').value),t=$('livraison').value;if(t==='usthb')return 0;if(!w||!t)return 0;return t==='domicile'?w[1]:w[2]}function update(){let t=$('livraison').value,w=W.find(x=>x[0]===$('wilaya').value),p=ship();$('adresse').classList.toggle('hidden',t!=='domicile');$('adresse').required=t==='domicile';$('shipPrice').textContent=money(p);$('casePrice').textContent=money(current?.prix);$('total').textContent=money(Number(current?.prix||0)+p);$('deliveryPrice').textContent=!w||!t?'Choisis la wilaya et la livraison.':t==='usthb'?'Livraison USTHB : gratuite':`${t==='domicile'?'Domicile':'Bureau'} : ${money(p)}`}async function load(){let r=await db.from('coques').select('*').order('created_at',{ascending:false});if(r.error){$('products').innerHTML='<div class="empty">Erreur de chargement</div>';return}all=(r.data||[]).filter(p=>p.disponible!==false);render()}function render(){let q=$('search').value.toLowerCase().trim(),a=all.filter(p=>{let text=((p.nom||'')+' '+(p.modele||'')).toLowerCase(),cat=(p.categorie||p.category||'cases').toLowerCase();return text.includes(q)&&(activeCat==='all'||cat===activeCat)});$('products').innerHTML=a.length?a.map(p=>{let im=imgs(p.image_url);return `<article class="card" onclick="openDetails('${p.id}')"><img src="${esc(im[0]||'')}"><h3>${esc(p.nom)}</h3></article>`}).join(''):'<div class="empty">Aucun produit dans cette catégorie 💗</div>'}document.querySelectorAll('.cat').forEach(b=>b.onclick=()=>{document.querySelectorAll('.cat').forEach(x=>x.classList.remove('active'));b.classList.add('active');activeCat=b.dataset.cat;render()});function openLight(src,e){e?.stopPropagation();$('lightImage').src=src;$('lightbox').classList.add('show')}function closeLightbox(e){e?.stopPropagation();$('lightbox').classList.remove('show')}function selectImg(i){$('mainImage').src=gallery[i]}function openDetails(id){current=all.find(p=>String(p.id)===String(id));selectedModel='';gallery=imgs(current.image_url);let ms=available(current);$('detailContent').innerHTML=`<img id="mainImage" class="detail-image" src="${esc(gallery[0]||'')}" onclick="openLight(this.src,event)">${gallery.length>1?`<div class="gallery">${gallery.map((x,i)=>`<img src="${esc(x)}" onclick="selectImg(${i})">`).join('')}</div>`:''}<h2>${esc(current.nom)}</h2><div class="price">${money(current.prix)}</div><h3>📱 Modèles disponibles</h3><div class="models">${ms.map(m=>`<button class="model" onclick="choose('${esc(m).replaceAll("'","&#39;")}')">${esc(m)}${hasStock(current)?' — '+Number(current.stock[m]||0)+' en stock':''}</button>`).join('')}</div><button class="btn" onclick="startOrder()">Commander</button>`;$('details').classList.add('show')}function choose(m){selectedModel=m;startOrder()}function startOrder(){if(!selectedModel){alert('Choisis un modèle.');return}$('details').classList.remove('show');$('chosen').innerHTML='<b>'+esc(current.nom)+'</b> — '+esc(selectedModel);$('order').classList.add('show');update()}function closeDetails(){$('details').classList.remove('show')}function closeOrder(){$('order').classList.remove('show')}$('wilaya').onchange=update;$('livraison').onchange=update;$('orderForm').onsubmit=async e=>{e.preventDefault();let t=$('livraison').value,w=W.find(x=>x[0]===$('wilaya').value),p=ship();if(!w||!t)return;let ad=t==='domicile'?$('adresse').value.trim():'-';if(t==='domicile'&&!ad){$('orderMsg').textContent='Adresse obligatoire à domicile.';return}let r=await db.from('coques').select('stock').eq('id',current.id).single();if(r.error){$('orderMsg').textContent='Erreur stock.';return}let st=r.data.stock,using=st&&typeof st==='object'&&!Array.isArray(st)&&Object.keys(st).length;if(using){let n=Number(st[selectedModel]||0);if(n<=0){$('orderMsg').textContent='Ce modèle est épuisé.';await load();closeOrder();return}st[selectedModel]=n-1;let up=await db.from('coques').update({stock:st,disponible:Object.values(st).some(v=>Number(v)>0)}).eq('id',current.id);if(up.error){$('orderMsg').textContent=up.error.message;return}}let order=await db.from('commandes').insert({coque_id:current.id,modele:selectedModel,nom:$('nom').value.trim(),prenom:$('prenom').value.trim(),telephone:$('tel').value.trim(),adresse:ad,livraison:t==='usthb'?'USTHB — Gratuit':`${t==='domicile'?'Domicile':'Bureau'} — ${w[0]} — ${p} DA`});if(order.error){$('orderMsg').textContent='Commande non enregistrée : '+order.error.message;return}$('orderMsg').textContent='Commande enregistrée 💗 Total : '+money(Number(current.prix)+p);e.target.reset();await load();update()};$('search').oninput=render;load()</script></body></html>
