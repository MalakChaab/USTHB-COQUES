<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>USTHB Coques</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><style>*{box-sizing:border-box}body{margin:0;font-family:Arial;background:#fff7fb;color:#4b3040}header{background:#ffd6e8;padding:24px;text-align:center;box-shadow:0 2px 12px #e9bfd0}.logo{font-size:28px;font-weight:800;color:#d94f8b}.tag{font-size:13px;margin-top:5px}main{max-width:1100px;margin:auto;padding:24px}.search{width:100%;padding:15px;border:2px solid #f2a7c8;border-radius:18px;font-size:16px}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:18px;margin-top:24px}.card{background:#fff;border-radius:20px;padding:14px;box-shadow:0 4px 18px #e9bfd0;cursor:pointer}.card img{width:100%;aspect-ratio:1;object-fit:cover;border-radius:15px}.card h3{margin:12px 3px 3px;font-size:17px}.modal{position:fixed;inset:0;background:#0007;display:none;align-items:center;justify-content:center;padding:15px;z-index:20}.modal.show{display:flex}.modalbox{background:#fff7fb;border-radius:24px;max-width:680px;width:100%;max-height:94vh;overflow:auto;padding:22px}.detail-image{display:block;width:260px;height:260px;object-fit:contain;border-radius:18px;margin:0 auto 12px;cursor:zoom-in}.gallery{display:flex;gap:8px;justify-content:center;flex-wrap:wrap}.gallery img{width:62px;height:62px;object-fit:cover;border-radius:10px;cursor:pointer}.lightbox{position:fixed;inset:0;background:#000d;display:none;align-items:center;justify-content:center;z-index:50}.lightbox.show{display:flex}.lightbox img{max-width:90vw;max-height:88vh}.close{float:right;border:0;background:#fff;border-radius:50%;width:35px;height:35px;font-size:20px}.models{display:flex;flex-wrap:wrap;gap:8px}.model{border:1px solid #edb1cb;background:#fff;padding:9px 12px;border-radius:20px;cursor:pointer}.price,.total{font-weight:800;color:#d94f8b}.btn{border:0;background:#d94f8b;color:#fff;padding:12px 16px;border-radius:14px;font-weight:700;cursor:pointer;width:100%;margin-top:10px}.field{width:100%;padding:12px;margin:6px 0;border:1px solid #efb0ca;border-radius:12px}.hidden{display:none}.summary{background:#fff;padding:14px;border-radius:15px;margin:10px 0}.admin{position:fixed;right:15px;bottom:15px;background:#fff;border:1px solid #f2a7c8;padding:10px 14px;border-radius:15px;color:#d94f8b;text-decoration:none}footer{text-align:center;padding:30px;color:#9b6d82}</style></head><body><header><div class="logo">🎀 USTHB_COQUES</div><div class="tag">PHONE CASES & ACCESSOIRES</div></header><main><h1>Nos coques 💗</h1><input id="search" class="search" placeholder="🔎 Rechercher une coque..."><div id="products" class="grid">Chargement…</div></main><a class="admin" href="admin.html">🔐 Admin</a><footer>Livraison dans les 58 wilayas • Bureau • Domicile • USTHB</footer><div id="details" class="modal"><div class="modalbox"><button class="close" onclick="closeDetails()">×</button><div id="detailContent"></div></div></div><div id="lightbox" class="lightbox" onclick="closeLightbox()"><img id="lightImage"></div><div id="order" class="modal"><div class="modalbox"><button class="close" onclick="closeOrder()">×</button><h2>🛍️ Commander</h2><form id="orderForm"><input class="field" id="prenom" required placeholder="Prénom"><input class="field" id="nom" required placeholder="Nom"><input class="field" id="tel" required placeholder="Numéro de téléphone"><div id="chosen"></div><select class="field" id="wilaya" required><option value="">Choisir votre wilaya</option></select><select class="field" id="livraison" required><option value="">Choisir la livraison</option><option value="bureau">🏢 Bureau (Stop Desk)</option><option value="domicile">🏠 Domicile</option><option value="usthb">🎓 USTHB</option></select><input class="field hidden" id="adresse" placeholder="Adresse"><div id="deliveryPrice" class="summary">Choisis la wilaya et la livraison.</div><div class="summary">Coque : <b id="casePrice">0 DA</b><br>Livraison : <b id="shipPrice">0 DA</b><hr><div class="total">Total : <span id="total">0 DA</span></div></div><button class="btn">Confirmer la commande</button></form><p id="orderMsg"></p></div></div><script>const U='https://sydurxdeqjgyuzvotmth.supabase.co',K='sb_publishable_YtZkRYlml5U_6OtOKcnnyQ_smF0CELK',db=supabase.createClient(U,K);let all=[],current=null,selectedModel='',gallery=[];const $=x=>document.getElementById(x),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])),money=n=>Number(n||0).toLocaleString('fr-DZ')+' DA';const hasStock=p=>p.stock&&typeof p.stock==='object'&&!Array.isArray(p.stock)&&Object.keys(p.stock).length>0;const stock=p=>p.stock||{};const models=v=>String(v||'').split('||').map(x=>x.trim()).filter(Boolean);const imgs=v=>String(v||'').split('||').map(x=>x.trim()).filter(Boolean);function available(p){let ms=models(p.modele);return hasStock(p)?ms.filter(m=>Number(stock(p)[m]||0)>0):ms}const W=[['Adrar',1200,800],['Chlef',750,450],['Laghouat',800,500],['Oum El Bouaghi',750,450],['Batna',750,450],['Béjaïa',750,450],['Biskra',800,500],['Béchar',1200,800],['Blida',650,450],['Bouira',750,450],['Tamanrasset',1900,1300],['Tébessa',800,500],['Tlemcen',750,500],['Tiaret',750,450],['Tizi Ouzou',750,450],['Alger',500,350],['Djelfa',800,450],['Jijel',750,450],['Sétif',750,450],['Saïda',800,450],['Skikda',750,450],['Sidi Bel Abbès',750,450],['Annaba',750,450],['Guelma',750,450],['Constantine',750,450],['Médéa',750,450],['Mostaganem',750,450],['M’Sila',750,450],['Mascara',850,600],['Ouargla',750,450],['Oran',850,450],['El Bayadh',2000,1300],['Illizi',750,450],['Bordj Bou Arreridj',750,450],['Boumerdès',750,500],['El Tarf',750,500],['Tindouf',1600,1000],['Tissemsilt',750,500],['El Oued',850,500],['Khenchela',750,450],['Souk Ahras',750,550],['Tipaza',650,500],['Mila',750,450],['Aïn Defla',750,450],['Naâma',850,600],['Aïn Témouchent',750,500],['Ghardaïa',850,600],['Relizane',750,500],['Timimoun',1450,1000],['Bordj Badji Mokhtar',2000,1300],['Ouled Djellal',850,500],['Beni Abbes',1300,900],['In Salah',1800,1100],['In Guezzam',2000,1300],['Touggourt',850,600],['Djanet',2000,1300],['El M’Ghair',850,500],['El Meniaa',950,600]];W.forEach(w=>{let o=document.createElement('option');o.value=w[0];o.textContent=w[0];$('wilaya').appendChild(o)});function ship(){let w=W.find(x=>x[0]===$('wilaya').value),t=$('livraison').value;if(t==='usthb')return 0;if(!w||!t)return 0;return t==='domicile'?w[1]:w[2]}function update(){let t=$('livraison').value,w=W.find(x=>x[0]===$('wilaya').value),p=ship();$('adresse').classList.toggle('hidden',t!=='domicile');$('adresse').required=t==='domicile';$('shipPrice').textContent=money(p);$('casePrice').textContent=money(current?.prix);$('total').textContent=money(Number(current?.prix||0)+p);$('deliveryPrice').textContent=!w||!t?'Choisis la wilaya et la livraison.':t==='usthb'?'Livraison USTHB : gratuite':`${t==='domicile'?'Domicile':'Bureau'} : ${money(p)}`}async function load(){let r=await db.from('coques').select('*').order('created_at',{ascending:false});if(r.error){$('products').textContent='Erreur de chargement';return}all=(r.data||[]).filter(p=>p.disponible!==false);render()}function render(){let q=$('search').value.toLowerCase(),a=all.filter(p=>((p.nom||'')+' '+(p.modele||'')).toLowerCase().includes(q));$('products').innerHTML=a.length?a.map(p=>{let im=imgs(p.image_url);return `<article class="card" onclick="openDetails('${p.id}')"><img src="${esc(im[0]||'')}"><h3>${esc(p.nom)}</h3></article>`}).join(''):'<div style="padding:40px">Aucune coque trouvée 💗</div>'}function openLight(src,e){e?.stopPropagation();$('lightImage').src=src;$('lightbox').classList.add('show')}function closeLightbox(){$('lightbox').classList.remove('show')}function selectImg(i){$('mainImage').src=gallery[i]}function openDetails(id){current=all.find(p=>String(p.id)===String(id));selectedModel='';gallery=imgs(current.image_url);let ms=available(current);$('detailContent').innerHTML=`<img id="mainImage" class="detail-image" src="${esc(gallery[0]||'')}" onclick="openLight(this.src,event)">${gallery.length>1?`<div class="gallery">${gallery.map((x,i)=>`<img src="${esc(x)}" onclick="selectImg(${i})">`).join('')}</div>`:''}<h2>${esc(current.nom)}</h2><div class="price">${money(current.prix)}</div><h3>📱 Modèles disponibles</h3><div class="models">${ms.map(m=>`<button class="model" onclick="choose('${esc(m).replaceAll("'","&#39;")}')">${esc(m)}${hasStock(current)?' — '+Number(stock(current)[m]||0)+' en stock':''}</button>`).join('')}</div><button class="btn" onclick="startOrder()">Commander</button>`;$('details').classList.add('show')}function choose(m){selectedModel=m;startOrder()}function startOrder(){if(!selectedModel){alert('Choisis un modèle.');return}$('details').classList.remove('show');$('chosen').innerHTML='<b>'+esc(current.nom)+'</b> — '+esc(selectedModel);$('order').classList.add('show');update()}function closeDetails(){$('details').classList.remove('show')}function closeOrder(){$('order').classList.remove('show')}$('wilaya').onchange=update;$('livraison').onchange=update;$('orderForm').onsubmit=async e=>{e.preventDefault();let t=$('livraison').value,w=W.find(x=>x[0]===$('wilaya').value),p=ship();if(!w||!t)return;let ad=t==='domicile'?$('adresse').value.trim():'-';if(t==='domicile'&&!ad){$('orderMsg').textContent='Adresse obligatoire à domicile.';return}let r=await db.from('coques').select('stock').eq('id',current.id).single();if(r.error){$('orderMsg').textContent='Erreur stock.';return}let st=r.data.stock,usingStock=st&&typeof st==='object'&&!Array.isArray(st)&&Object.keys(st).length>0;if(usingStock){let n=Number(st[selectedModel]||0);if(n<=0){$('orderMsg').textContent='Ce modèle est épuisé.';await load();closeOrder();return}st[selectedModel]=n-1;let up=await db.from('coques').update({stock:st,disponible:Object.values(st).some(v=>Number(v)>0)}).eq('id',current.id);if(up.error){$('orderMsg').textContent=up.error.message;return}}let order=await db.from('commandes').insert({coque_id:current.id,modele:selectedModel,nom:$('nom').value.trim(),prenom:$('prenom').value.trim(),telephone:$('tel').value.trim(),adresse:ad,livraison:t==='usthb'?'USTHB — Gratuit':`${t==='domicile'?'Domicile':'Bureau'} — ${w[0]} — ${p} DA`});if(order.error){$('orderMsg').textContent='Commande non enregistrée : '+order.error.message;return}$('orderMsg').textContent='Commande enregistrée 💗 Total : '+money(Number(current.prix)+p);e.target.reset();await load();update()};$('search').oninput=render;load()</script></body></html>
