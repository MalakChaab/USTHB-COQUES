="closeLightbox(event)">×</button><img id="lightImage" src="" onclick="event.stopPropagation()"></div><div id="order" class="modal"><div class="modalbox"><button class="close" onclick="closeOrder()">×</button><h2>🛍️ Commander</h2><form id="orderForm"><input class="field" id="prenom" required placeholder="Prénom"><input class="field" id="nom" required placeholder="Nom"><input class="field" id="tel" required placeholder="Numéro de téléphone"><div id="chosen"></div><select class="field" id="wilaya" required><option value="">Choisir votre wilaya</option></select><select class="field" id="livraison" required><option value="">Choisir le type de livraison</option><option value="bureau">🏢 Bureau (Stop Desk)</option><option value="domicile">🏠 Domicile</option><option value="usthb">🎓 USTHB</option></select><input class="field hidden" id="adresse" placeholder="Adresse de livraison (obligatoire à domicile)"><div id="deliveryPrice" class="summary">Choisis la wilaya et le type de livraison.</div><div class="summary"><div>Prix coque : <b id="casePrice">0 DA</b></div><div>Livraison : <b id="shipPrice">0 DA</b></div><hr><div class="total">Total : <span id="total">0 DA</span></div></div><button class="btn">Confirmer la commande</button></form><div id="orderMsg" class="small"></div></div></div><script>const SUPABASE_URL='https://sydurxdeqjgyuzvotmth.supabase.co',SUPABASE_KEY='sb_publishable_YtZkRYlml5U_6OtOKcnnyQ_smF0CELK',db=window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY);let all=[],current=null,selectedModel='',gallery=[];const $=x=>document.getElementById(x);const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const money=n=>Number(n||0).toLocaleString('fr-DZ')+' DA';const stockOf=(p,m)=>Math.max(0,Number((p.stock||{})[m]??0));const wilayas=[['Adrar',1200,800],['Chlef',750,450],['Laghouat',800,500],['Oum El Bouaghi',750,450],['Batna',750,450],['Béjaïa',750,450],['Biskra',800,500],['Béchar',1200,800],['Blida',650 n.':t==='usthb'?'<b>🎓 Livraison USTHB : gratuite</b>':`<b>${t==='domicile'?'🏠 Domicile':'🏢 Bureau (Stop Desk)'}</b> — ${money(p)} pour ${esc(w[0])}`}async function load(){let r=await db.from('coques').select('*').eq('disponible',true).order('created_at',{ascending:false});if(r.error){$('products').innerHTML='<div class="empty">Erreur de chargement.</div>';return}all=r.data||[];all=all.filter(x=>availableModels(x).length);render()}function render(){let q=$('search').value.toLowerCase().trim(),a=all.filter(x=>((x.nom||'')+' '+(x.modele||'')).toLowerCase().includes(q));$('products').innerHTML=a.length?a.map(x=>{let im=imgs(x.image_url);return `<article class="card" onclick="openDetails('${x.id}')"><img src="${esc(im[0]||'')}" onerror="this.style.visibility='hidden'"><h3>${esc(x.nom)}</h3></article>`}).join(''):'<div class="empty">Aucune coque trouvée 💗</div>'}function openLightbox(src,e){if(e)e.stopPropagation();$('lightImage').src=src;$('lightbox').classList.add('show')}function closeLightbox(e){if(e)e.stopPropagation();$('lightbox').classList.remove('show')}function selectImg(i){gallery.forEach((_,j)=>{let e=$('g'+j);if(e)e.classList.toggle('active',j===i)});$('mainImage').src=gallery[i]}async function openDetails(id){current=all.find(x=>String(x.id)===String(id));if(!current)return;selectedModel='';gallery=imgs(current.image_url);let ms=availableModels(current);$('detailContent').innerHTML=`<img id="mainImage" class="detail-image" src="${esc(gallery[0]||'')}" onclick="openLightbox(this.src,event)">${gallery.length>1?`<div class="gallery">${gallery.map((x,i)=>`<img id="g${i}" class="${i?'':'active'}" src="${esc(x)}" onclick="selectImg(${i})">`).join('')}</div>`:''}<h2>${esc(current.nom)}</h2><div class="price">${money(current.prix)}</div><h3>📱 Téléphones disponibles</h3><div class="models">${ms.map(m=>`<button class="model" onclick="chooseModel('${esc(m).replaceAll("'","&#39;")}')">${esc(m)} — ${stockOf(current,m)} restant${stockOf(current,m)>1?'s':''}</button>`).join('')}</div><div class="stocknote">Les modèles épuisés ne sont plus proposés.</div><button class="btn" onclick="startOrder()">Commander</button>`;$('details').classList.add('show')}function chooseModel(m){if(stockOf(current,m)<=0){alert('Ce modèle est épuisé.');return}selectedModel=m;startOrder()}function startOrder(){if(!selectedModel){alert('Choisis d’abord ton modèle de téléphone.');return}$('details').classList.remove('show');$('chosen').innerHTML='<p><b>'+esc(current.nom)+'</b> — '+esc(selectedModel)+'</p>';$('orderMsg').textContent='';$('order').classList.add('show');update()}function closeModal(){$('details').classList.remove('show')}function closeOrder(){$('order').classList.remove('show')}$('wilaya').addEventListener('change',update);$('livraison').addEventListener('change',update);$('orderForm').addEventListener('submit',async e=>{e.preventDefault();let t=$('livraison').value,w=wilayas.find(x=>x[0]===$('wilaya').value),p=ship();if(!w||!t)return;let address=t==='domicile'?$('adresse').value.trim():'-';if(t==='domicile'&&!address){$('orderMsg').textContent='L’adresse est obligatoire pour une livraison à domicile.';return}let r=await db.from('coques').select('stock').eq('id',current.id).single();if(r.error){$('orderMsg').textContent='Impossible de vérifier le stock.';return}let st=r.data?.stock||{},qty=Math.max(0,Number(st[selectedModel]??0));if(qty<=0){$('orderMsg').textContent='Désolé, ce modèle vient d’être épuisé.';await load();closeOrder();return}st[selectedModel]=qty-1;let upd=await db.from('coques').update({stock:st,disponible:Object.values(st).some(v=>Number(v)>0)}).eq('id',current.id);if(upd.error){$('orderMsg').textContent='Impossible de mettre à jour le stock : '+upd.error.message;return}let livraison=t==='usthb'?'USTHB — Gratuit':`${t==='domicile'?'Domicile':'Bureau (Stop Desk)'} — ${w[0]} — ${p} DA`,payload={coque_id:current.id,modele:selectedModel,nom:$('nom').value.trim(),prenom:$('prenom').value.trim(),telephone:$('tel').value.trim(),adresse:address,livraison:livraison};let order=await db.from('commandes').insert(payload).select('id').single();if(order.error){$('orderMsg').textContent='Commande non enregistrée : '+order.error.message;st[selectedModel]=qty;await db.from('coques').update({stock:st,disponible:true}).eq('id',current.id);return}$('orderMsg').textContent='Commande enregistrée 💗 Total : '+money(Number(current.prix)+p);e.target.reset();await load();update()});$('search').addEventListener('input',render);load();</script></body></html>
